---
exclude_paths:
  - "**/static/**"
  - "**/*.js"
  - "**/*.css"
  - "**/*.html"
  - "**/*.zip"
  - "**/*.tgz"
  - "**/*.sh"
  - "**/*.bat"
  - "**/*.md"
  # Recursive: the single-star form only matched the direct children of src/test (i.e. the `java`
  # directory itself), so test sources were in practice excluded only when their name happened to end
  # in Test.java or IT.java. A test-support class named anything else was analysed as production code.
  - "**/src/test/**"
  - "**/*Test.java"
  - "**/*IT.java"
  # Java test sources have their own exclusion above; the non-Java test suites (bindings/python/tests,
  # e2e-python/tests, e2e-studio/tests, .github/scripts/tests) had none, so pytest's standard
  # `assert`-per-check idiom was scanned as if it were production code (Bandit B101, already skipped
  # project-wide for exactly this reason - see bindings/python/pyproject.toml's [tool.bandit]) and
  # analysed against a docstring-summary convention (D213) the project's own production code does not
  # follow either (issue #7123 review).
  - "**/tests/**"
  - "**/*CharStream.java"
  - "**/SqlParser*.java"
  - "**/GraphQLParser*.java"
  - "**/ParseException*.java"
  - "**/TokenMgrException.java"
  - "**/TokenMgrError.java"
