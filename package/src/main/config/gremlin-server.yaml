host: 0.0.0.0
graphs:
  graph: config/gremlin-server.properties
# Note: additional graphs are registered dynamically by ArcadeGraphManager based on database name
scriptEngines:
  # gremlin-lang parses scripts with the Gremlin grammar and never executes code: every authorized user may submit it
  # (RequestOptions.language("gremlin-lang")). gremlin-groovy, the default language of a script with none, evaluates
  # arbitrary JVM code and is reserved to the server administrator (root).
  gremlin-lang: {}
  gremlin-groovy:
    plugins:
      org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {}
      org.apache.tinkerpop.gremlin.jsr223.ImportGremlinPlugin:
        classImports:
          - java.lang.Math
        methodImports:
          - "java.lang.Math#*"
serializers:
  - className: org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1
    config:
      ioRegistries:
        - com.arcadedb.gremlin.io.ArcadeIoRegistry
  - className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV3
    config:
      ioRegistries:
        - com.arcadedb.gremlin.io.ArcadeIoRegistry
  - className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV2
    config:
      ioRegistries:
        - com.arcadedb.gremlin.io.ArcadeIoRegistry
