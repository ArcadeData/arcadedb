syntax = "proto3";

package com.arcadedb.grpc;

option java_multiple_files = true;
option java_package = "com.arcadedb.server.grpc";
option java_outer_classname = "ArcadeDbProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// -----------------------------------------------------------------------------
// Common types
// -----------------------------------------------------------------------------

message DatabaseCredentials {
  string username = 1;
  string password = 2;
}

message TransactionContext {
  string transaction_id = 1;  // optional correlation
  string database       = 2;  // optional if request already has database
  bool begin            = 3;  // start a tx if not already active
  bool commit           = 4;  // commit at end of call/stream
  bool rollback         = 5;  // rollback at end of call/stream
  int64 timeout_ms      = 6;  // optional per-tx timeout
  bool  read_only       = 7;  // optional hint
}

message RowError {
  uint64 row_index = 1; string code = 2; string message = 3; string field = 4;
}

// -----------------------------------------------------------------------------
// GRPC Record
// -----------------------------------------------------------------------------

// A record (vertex/document)
message GrpcRecord {
  string rid  = 1;  // empty for embedded docs
  string type = 2;  // ArcadeDB class/type name (optional for embedded)
  map<string, GrpcValue> properties = 3;
}

// Typed values, recursively composable
message GrpcValue {
  oneof kind {
    bool                      bool_value       = 1;
    int32                     int32_value      = 2;
    int64                     int64_value      = 3;  // epoch ms, counters, etc.
    float                     float_value      = 4;
    double                    double_value     = 5;
    string                    string_value     = 6;
    bytes                     bytes_value      = 7;  // binary
    google.protobuf.Timestamp timestamp_value  = 8;  // date/datetime
    GrpcList                  list_value       = 9;  // LIST
    GrpcMap                   map_value        = 10; // schemaless MAP
    GrpcEmbedded              embedded_value   = 11; // embedded doc
    GrpcLink                  link_value       = 12; // RID link
    GrpcDecimal               decimal_value    = 13; // exact decimal
  }

  // Optional semantic hint (non-breaking): "date", "datetime", "rid", "decimal(38,9)", etc.
  string logical_type = 14;
}

// Containers
message GrpcList    { repeated GrpcValue values = 1; }
message GrpcMap     { map<string, GrpcValue> entries = 1; }
message GrpcEmbedded{
  string type = 1;  // ArcadeDB class name if present; may be empty
  map<string, GrpcValue> fields = 2;
}

// RID link
message GrpcLink {
  string rid  = 1;  // e.g., "#12:0"
  string type = 2;  // optional target class
}

// Exact decimal without loss
message GrpcDecimal {
  sint64 unscaled       = 1; // unscaled value when it fits in a signed 64-bit integer
  int32  scale          = 2; // number of decimal places
  bytes  unscaled_bytes = 3; // big-endian two's-complement unscaled value when it exceeds 63 bits (takes precedence over `unscaled` when non-empty)
}

message ProjectionSettings {
  bool include_projections = 1;

  // Reuse the same enum (either nested under ExecuteQueryRequest or a top-level enum)
  enum ProjectionEncoding {
    PROJECTION_AS_LINK = 0;
    PROJECTION_AS_MAP  = 1;
    PROJECTION_AS_JSON = 2;
  }
  ProjectionEncoding projection_encoding = 2;

  optional google.protobuf.Int32Value soft_limit_bytes = 3;  // <-- this is the one protoc complained about; use 3
}

// -----------------------------------------------------------------------------
// Query (streaming) API
// -----------------------------------------------------------------------------

message StreamQueryRequest {

  string database = 1;
  string query = 2;

  map<string, GrpcValue> parameters = 3;

  DatabaseCredentials credentials = 4;

  int32 batch_size = 5;

  enum RetrievalMode {
    CURSOR = 0;          // run once, stream as you iterate
    MATERIALIZE_ALL = 1; // load all then emit in batches
    PAGED = 2;           // re-issue with LIMIT/SKIP per batch
  }
  RetrievalMode retrieval_mode = 6;

  string language = 7; // e.g., "sql" (default if empty)
  TransactionContext transaction = 8; // optional

  ProjectionSettings projectionSettings = 9;
}

message QueryResult {
  repeated GrpcRecord records = 1;
  int32  total_records_in_batch = 2;
  int64  running_total_emitted  = 3;
  bool   is_last_batch          = 4;
}

service ArcadeDbService {

  // Streaming queries
  rpc StreamQuery (StreamQueryRequest) returns (stream QueryResult);

  // Execute arbitrary command (INSERT/UPDATE/DDL/etc.)
  rpc ExecuteCommand (ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);

  // Single-record helpers
  rpc CreateRecord (CreateRecordRequest) returns (CreateRecordResponse);
  rpc UpdateRecord (UpdateRecordRequest) returns (UpdateRecordResponse);
  rpc LookupByRid  (LookupByRidRequest)  returns (LookupByRidResponse);
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);

  // Insert APIs (unary, client-streaming, and bidi)
  rpc BulkInsert          (BulkInsertRequest)       returns (InsertSummary);
  rpc InsertStream        (stream InsertChunk)      returns (InsertSummary);
  rpc InsertBidirectional (stream InsertRequest)    returns (stream InsertResponse);

  // Transaction operations
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);

  // Graph batch load (client-streaming)
  rpc GraphBatchLoad (stream GraphBatchChunk) returns (GraphBatchResult);

  // Time series (issue #7305). The streaming write is the one that matters most: time-series ingest is
  // high-rate, small and uniformly shaped, which is the case gRPC is best suited to. The query streams its
  // answer rather than buffering it, so a wide range is bounded by the client's consumption and not by the
  // server's heap.
  rpc TimeSeriesWrite       (TimeSeriesWriteRequest)      returns (TimeSeriesWriteSummary);
  rpc TimeSeriesWriteStream (stream TimeSeriesWriteChunk) returns (TimeSeriesWriteSummary);
  rpc TimeSeriesQuery       (TimeSeriesQueryRequest)      returns (stream TimeSeriesQueryResult);
  rpc TimeSeriesLatest      (TimeSeriesLatestRequest)     returns (TimeSeriesLatestResponse);
}

// -----------------------------------------------------------------------------
// Transaction operations
// -----------------------------------------------------------------------------

message BeginTransactionRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  TransactionIsolation isolation = 3;
}

enum TransactionIsolation {
  READ_UNCOMMITTED = 0;
  READ_COMMITTED = 1;
  REPEATABLE_READ = 2;
  SERIALIZABLE = 3;
}

message BeginTransactionResponse {
  string transaction_id = 1;
  int64 timestamp = 2;
}

message CommitTransactionRequest {
  TransactionContext transaction = 1;
  DatabaseCredentials credentials = 2;
}

message CommitTransactionResponse {
  bool success = 1;
  bool committed = 2;
  string message = 3;
  int64 timestamp = 4;
}

message RollbackTransactionRequest {
  TransactionContext transaction = 1;
  DatabaseCredentials credentials = 2;
}

message RollbackTransactionResponse {
  bool success = 1;
  bool rolled_back = 2;
  string message = 3;
}

// -----------------------------------------------------------------------------
// Delete Record
// -----------------------------------------------------------------------------

message DeleteRecordRequest {
  string database = 1;
  string rid = 2;
  DatabaseCredentials credentials = 3;
  TransactionContext transaction = 4; // optional begin/commit/rollback flags
}

message DeleteRecordResponse {
  bool success = 1;   // call succeeded
  bool deleted = 2;   // record actually removed
  string message = 3; // optional info ("not found", error text if success=false, etc.)
}

// -----------------------------------------------------------------------------
// Execute Command
// -----------------------------------------------------------------------------

message ExecuteCommandRequest {

  string database = 1;

  string command  = 2;

  map<string, GrpcValue> parameters = 3;

  DatabaseCredentials credentials = 4;
  TransactionContext  transaction = 5;

  string language = 6; // "sql" if empty

  bool  return_rows = 7; // include rows in response
  int32 max_rows    = 8; // cap returned rows (server may still count all)

  ProjectionSettings projectionSettings = 9;
}

message ExecuteCommandResponse {
  bool  success = 1;
  string message = 2;

  int64 affected_records = 3; // server-computed (elements + numeric scalars)
  int64 execution_time_ms = 4;

  repeated GrpcRecord records = 5; // optional row payload if return_rows=true

  QueryUpdateStats stats = 6; // present only for write commands that mutated data
}

message QueryUpdateStats {
  int32 nodes_created = 1;
  int32 nodes_deleted = 2;
  int32 relationships_created = 3;
  int32 relationships_deleted = 4;
  int32 properties_set = 5;
  int32 labels_added = 6;
  int32 labels_removed = 7;
  int32 indexes_added = 8;
  int32 indexes_removed = 9;
  int32 constraints_added = 10;
  int32 constraints_removed = 11;
  bool contains_updates = 12;
}

// -----------------------------------------------------------------------------
// Execute Query
// -----------------------------------------------------------------------------

message ExecuteQueryRequest {
  string database = 1;
  string query = 2;
  map<string, GrpcValue> parameters = 3;

  DatabaseCredentials credentials = 4;
  TransactionContext transaction = 5;
  int32 limit = 6;
  int32 timeout_ms = 7;

  ProjectionSettings projectionSettings = 8;
  string language = 9; // "sql" if empty (default)
}

message ExecuteQueryResponse {
  repeated QueryResult results = 1;
  int64 execution_time_ms = 2;
  string query_plan = 3;
}

// -----------------------------------------------------------------------------
// GrpcRecord CRUD helpers
// -----------------------------------------------------------------------------

message CreateRecordRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  string type = 3;   // target class/type
  GrpcRecord record = 4; // payload
  TransactionContext transaction = 5;
}

message CreateRecordResponse {
  string rid = 1;
}

// Helper wrapper so we can use a map with oneof
message PropertiesUpdate {
  map<string, GrpcValue> properties = 1;
}

message UpdateRecordRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  string rid = 3;

  oneof payload {
    GrpcRecord       record  = 4; // full replacement
    PropertiesUpdate partial = 5; // partial update (map wrapped)
  }

  TransactionContext transaction = 6;
}

message UpdateRecordResponse {
  bool success = 1;
  bool updated = 2;
}

message LookupByRidRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  string rid = 3;
  TransactionContext transaction = 4; // optional: read within an externally-managed transaction
}
message LookupByRidResponse {
  bool   found = 1;
  GrpcRecord record = 2; // present if found
}

// -----------------------------------------------------------------------------
// Insert API (shared types)
// -----------------------------------------------------------------------------

message InsertError {
  string message   = 1;
  int64  row_index = 2; // index within the chunk (or -1 if not applicable)
  string code      = 3; // optional machine-usable code
  string field     = 4;
}

message InsertSummary {
  int64 received = 1;
  int64 inserted = 2;
  int64 updated  = 3;
  int64 ignored  = 4;
  int64 failed   = 5;
  repeated InsertError errors = 6;
  int64 execution_time_ms = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
}

message InsertOptions {

  string target_class = 1;       // required
  repeated string key_columns = 2;

  enum ConflictMode {
    CONFLICT_ERROR  = 0; // default (fail on dup)
    CONFLICT_UPDATE = 1; // upsert/update
    CONFLICT_IGNORE = 2; // drop dup
    CONFLICT_ABORT  = 3;
  }

  ConflictMode conflict_mode = 3;

  // Columns to overwrite when CONFLICT_UPDATE matches an existing row. Empty = merge all non-key
  // columns present on the incoming record. A column whose incoming value is absent or a proto
  // NullValue is skipped (left unchanged, not rejected), so a property cannot be set to null through
  // this path. For edge targets the out/in endpoints are always ignored here (endpoints cannot be
  // re-pointed by an upsert).
  repeated string update_columns_on_conflict = 4;

  enum TransactionMode {
    PER_REQUEST = 0; // one tx for the entire RPC (commit once at stream end)
    PER_BATCH   = 1; // commit every server_batch_size rows
    PER_STREAM  = 2; // one tx for the entire stream (commit once at stream end)
    PER_ROW     = 3; // commit after every row
    NONE        = 4; // caller manages externally
  }

  TransactionMode transaction_mode = 5;

  int32 server_batch_size = 6; // hint; 0 => server chooses

  bool validate_only = 7;                  // dry-run (no commit)

  string database = 8;
  DatabaseCredentials credentials = 9;
}

// -----------------------------------------------------------------------------
// Insert: Unary Bulk
// -----------------------------------------------------------------------------

message BulkInsertRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;

  InsertOptions options = 3;
  repeated GrpcRecord rows  = 4;

  TransactionContext transaction = 5; // optional
}

// -----------------------------------------------------------------------------
// Insert: Client-Streaming
// -----------------------------------------------------------------------------

message InsertChunk {
  // REQUIRED on the first chunk; optional on subsequent chunks (server caches)
  string database = 1;
  DatabaseCredentials credentials = 2;
  InsertOptions options = 3;
  TransactionContext transaction = 4;

  // Streaming envelope
  string session_id = 5; // client-generated stable ID
  int64  chunk_seq  = 6; // 1,2,3,...

  // Payload
  repeated GrpcRecord rows = 7;

  // Optional client hint
  bool last = 8;
}

// -----------------------------------------------------------------------------
// Insert: Bidirectional
// -----------------------------------------------------------------------------

message InsertRequest {
  oneof msg {
    Start       start = 1;
    InsertChunk chunk = 2;
    Commit      commit = 3;
  }
}

message Start {
  string database = 1;
  DatabaseCredentials credentials = 2;
  InsertOptions options = 3;
  TransactionContext transaction = 4;
  string session_id = 5; // may be empty; server can echo a generated one
}

message Commit {
  string session_id = 1;
  bool commit  = 2; // if both false, server may default to commit
  bool rollback = 3;
}

message InsertResponse {
  oneof msg {
    Started   started   = 1;
    BatchAck  batch_ack = 2;
    Committed committed = 3;
    InsertError error   = 4; // immediate error if any
  }
}

message Started {
  string session_id = 1;
}

message BatchAck {
  string session_id = 1;
  int64  chunk_seq  = 2;

  // Tallies for this chunk only
  int64 inserted = 3;
  int64 updated  = 4;
  int64 ignored  = 5;
  int64 failed   = 6;

  repeated InsertError errors = 7; // batch-scoped
}

message Committed {
  InsertSummary summary = 1; // full-stream totals
}

// ---------------------------------------------------------------------------
// Graph Batch Load API
// ---------------------------------------------------------------------------

message GraphBatchOptions {
  int32  batch_size               = 1;  // default 100000
  bool   light_edges              = 2;  // default false
  bool   wal                      = 3;  // default false
  optional bool   parallel_flush           = 4;  // default true (unset = true)
  optional bool   pre_allocate_edge_chunks = 5;  // default true (unset = true)
  int32  edge_list_initial_size   = 6;  // default 2048
  optional bool   bidirectional            = 7;  // default true (unset = true)
  int32  commit_every             = 8;  // default 50000
  int32  expected_edge_count      = 9;  // default 0
  // Vertices accumulated before they are created and committed in a single transaction (default 10000).
  // On a replicated database that transaction ships as one Raft entry, so lower it when the server warns
  // that a replicated entry approaches the maximum entry size. Mirrors the HTTP 'vertexBatchSize' parameter.
  int32  vertex_batch_size        = 10; // default 10000
  // Optional, unlike the sizing fields above, because zero is a meaningful setting for both and not the same
  // thing as leaving them alone: no retries at all (fail on the first error) and no back-off before the first
  // retry. A plain int32 could not tell that apart from unset.
  optional int32 commit_retries        = 11; // default 10; 0 disables retrying
  optional int64 commit_retry_delay_ms = 12; // default 1000
  // Whether the server echoes the temp_id -> RID mapping back in GraphBatchResult. Unset means AUTO: the
  // mapping is returned only while it stays under the server-side cap, past which it is dropped and
  // reported through id_mapping_omitted / id_mapping_size. Set it to false when the caller does not need
  // the RIDs back: the server resolves temp IDs itself for the whole stream, so a single-stream loader
  // never needs the mapping and dropping it removes the message-size ceiling entirely. Set it to true to
  // demand the mapping whatever its size, accepting that a large one may exceed maxInboundMessageSize.
  optional bool return_id_mapping = 13;
}

message GraphBatchRecord {
  enum Kind { VERTEX = 0; EDGE = 1; }
  Kind   kind      = 1;
  string type_name = 2;  // vertex or edge type name
  string temp_id   = 3;  // vertex temp ID (for later edge references)
  string from_ref  = 4;  // edge source: temp ID or "#bucket:pos"
  string to_ref    = 5;  // edge target: temp ID or "#bucket:pos"
  map<string, GrpcValue> properties = 6;
}

// IMPORTANT: all VERTEX records must appear before any EDGE records across all chunks.
// Interleaving is not supported and will result in an error.
message GraphBatchChunk {
  string database                    = 1;  // required on first chunk
  DatabaseCredentials credentials    = 2;  // optional if channel-level auth is used
  GraphBatchOptions options          = 3;  // required on first chunk, ignored after
  repeated GraphBatchRecord records  = 4;
}

message GraphBatchResult {
  int64 vertices_created         = 1;
  int64 edges_created            = 2;
  int64 elapsed_ms               = 3;
  // temp_id -> RID string. Subject to GraphBatchOptions.return_id_mapping: an omitted mapping is not an
  // empty one, so read id_mapping_omitted before concluding that no temp IDs were used. Left unset rather
  // than silently truncated, because a partial mapping would resolve some edge references and drop the rest.
  map<string, string> id_mapping = 4;
  // The mapping is not in this message. On a successful load that means it exceeded the server-side cap while
  // return_id_mapping was left unset; on the failure trailer described below it is always set, because a
  // trailer is bounded far below a message and never carries the mapping at all. It is never set when the
  // caller asked for no mapping: nothing was dropped that they wanted.
  bool  id_mapping_omitted       = 5;
  int64 id_mapping_size          = 6;  // number of temp IDs mapped, reported whether or not the mapping travels
  // A load that failed part-way still committed everything the batch had already flushed: GraphBatch commits
  // incrementally (commit_every / vertex_batch_size), so an error is not a rollback. The server reports the
  // counts durable at the point of failure in the 'arcadedb-graph-batch-result-bin' trailer of the failed
  // call, with this flag set, so a caller can reconcile instead of blindly re-sending the whole load.
  // On that trailer edges_created counts only edges whose flush committed: an edge is buffered when its record
  // is received and reaches the database later, so counting received edges would overstate what survived and
  // lead a caller to re-send too little. vertices_created needs no such distinction - a vertex is counted once
  // its own commit has returned.
  bool  partial_commit           = 7;
}

// -----------------------------------------------------------------------------
// Time series API (issue #7305)
// -----------------------------------------------------------------------------

// Unit of TimeSeriesPoint.timestamp. Unlike the HTTP /ts/{database}/write endpoint - which speaks InfluxDB
// Line Protocol and therefore defaults to that protocol's nanoseconds - this API is typed and its zero value
// is MILLISECONDS, the unit the engine actually stores. The common case needs no conversion and no field set.
enum TimeSeriesPrecision {
  TS_PRECISION_MILLISECONDS = 0;
  TS_PRECISION_NANOSECONDS  = 1;
  TS_PRECISION_MICROSECONDS = 2;
  TS_PRECISION_SECONDS      = 3;
}

// One sample. Values reuse GrpcValue rather than a parallel scalar encoding, so the type-fidelity fixes made
// there (#4149 temporal precision, #5046 byte/short widths, decimal) apply to time series too. A tag or field
// the type does not declare is ignored, exactly as an unknown line-protocol tag is; a declared column with no
// entry here is stored as absent, which reads back as null.
message TimeSeriesPoint {
  // The measurement, i.e. the TIMESERIES type name. Empty means the request- or chunk-level default, which is
  // how a single-measurement stream avoids repeating the name on every point.
  string type = 1;
  int64  timestamp = 2;
  map<string, GrpcValue> tags = 3;
  map<string, GrpcValue> fields = 4;
}

message TimeSeriesWriteRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  // Default measurement for points that do not name one.
  string type = 3;
  TimeSeriesPrecision precision = 4;
  repeated TimeSeriesPoint points = 5;
}

message TimeSeriesWriteChunk {
  // REQUIRED on the first chunk; ignored on later ones (the server caches the first chunk's database).
  string database = 1;
  DatabaseCredentials credentials = 2;
  // Default measurement for points in THIS chunk that do not name one, so a stream can switch measurement
  // between chunks without naming it on every point.
  string type = 3;
  TimeSeriesPrecision precision = 4;
  repeated TimeSeriesPoint points = 5;
}

// A write is NOT atomic: each measurement's batch commits its own shard transaction as it is appended, so a
// failure part-way leaves the measurements before it durable. `dropped` is therefore a partial-write signal,
// not a rollback - the same contract the HTTP endpoint reports with its 400. Every point is either written or
// counted in exactly one of the three type lists, so written + dropped == received.
message TimeSeriesWriteSummary {
  int64 received = 1;
  int64 written  = 2;
  int64 dropped  = 3;
  // No type with this name exists: create it first with CREATE TIMESERIES TYPE.
  repeated string unknown_types = 4;
  // The type exists but is not a TIMESERIES type.
  repeated string non_time_series_types = 5;
  // The type IS a TIMESERIES type; its storage engine failed to load (see the server log for why).
  repeated string unavailable_types = 6;
  int64 execution_time_ms = 7;
}

// Mirrors com.arcadedb.engine.timeseries.AggregationType. UNSPECIFIED is the proto3 zero value and is
// rejected rather than silently defaulted, so a client that forgets the field is told so.
enum TimeSeriesAggregationType {
  TS_AGG_UNSPECIFIED = 0;
  TS_AGG_SUM         = 1;
  TS_AGG_AVG         = 2;
  TS_AGG_MIN         = 3;
  TS_AGG_MAX         = 4;
  TS_AGG_COUNT       = 5;
}

// Conjunction of tag equality predicates. Values are coerced to the tag column's declared type, so a tag
// declared INTEGER matches whether the client sent int32_value or string_value. A name that is not a TAG
// column of the type contributes no predicate.
message TimeSeriesTagFilter {
  map<string, GrpcValue> equals = 1;
}

message TimeSeriesAggregationRequest {
  string field = 1;
  TimeSeriesAggregationType type = 2;
  // Output name. Empty defaults to "<field>_<type>" lowercased, matching the HTTP endpoint.
  string alias = 3;
}

message TimeSeriesAggregation {
  int64 bucket_interval_ms = 1;
  repeated TimeSeriesAggregationRequest requests = 2;
}

message TimeSeriesQueryRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  string type = 3;
  // Inclusive bounds. Optional because 0 is a real epoch timestamp and not the same thing as "no bound":
  // unset means unbounded in that direction.
  optional int64 from_timestamp = 4;
  optional int64 to_timestamp   = 5;
  // Column projection; empty means every column. The timestamp column is always included and always first.
  repeated string fields = 6;
  TimeSeriesTagFilter tags = 7;
  // Maximum rows returned across the whole stream. Non-positive means the server default; the server-side
  // hard ceiling (arcadedb.server.httpQueryMaxResultRows) still applies and cannot be widened from here.
  int32 limit = 8;
  // Rows (or buckets) per streamed message. 0 lets the server choose.
  int32 batch_size = 9;
  // When set, the answer carries buckets instead of rows.
  TimeSeriesAggregation aggregation = 10;
}

// A row of a raw query, or the values of one aggregation bucket. A value that stands for "no measurement" -
// an absent MIN/MAX, a non-finite sample - is sent with no kind set, which decodes to null; it is NOT sent as
// double_value NaN, which a client would read as a number.
message TimeSeriesRow {
  repeated GrpcValue values = 1;
}

message TimeSeriesBucket {
  int64 timestamp = 1;
  repeated GrpcValue values = 2;
}

// Streamed answer. `columns` and `aggregations` are carried on every message so a consumer that starts
// reading mid-stream (or drops the first message on a retry) is never left without the header.
message TimeSeriesQueryResult {
  string type = 1;
  // Names of the values in each `rows` entry, in order. Empty for an aggregated answer.
  repeated string columns = 2;
  // Aliases of the values in each `buckets` entry, in order. Empty for a raw answer.
  repeated string aggregations = 3;
  repeated TimeSeriesRow rows = 4;
  repeated TimeSeriesBucket buckets = 5;
  int64 running_total_emitted = 6;
  bool  last = 7;
  // The limit cut the answer short: what follows this stream is not the end of the data. Only meaningful on
  // the message whose `last` is true.
  bool  truncated = 8;
}

message TimeSeriesLatestRequest {
  string database = 1;
  DatabaseCredentials credentials = 2;
  string type = 3;
  TimeSeriesTagFilter tags = 4;
}

message TimeSeriesLatestResponse {
  string type = 1;
  repeated string columns = 2;
  // False when the type (or the tag selection) holds no sample at all; `latest` is then unset.
  bool  found = 3;
  TimeSeriesRow latest = 4;
}

// -----------------------------------------------------------------------------
// Admin service
// -----------------------------------------------------------------------------

service ArcadeDbAdminService {
  rpc Ping           (PingRequest)           returns (PingResponse);
  rpc GetServerInfo  (GetServerInfoRequest)  returns (GetServerInfoResponse);

  rpc ListDatabases  (ListDatabasesRequest)  returns (ListDatabasesResponse);
  rpc ExistsDatabase (ExistsDatabaseRequest) returns (ExistsDatabaseResponse);
  rpc CreateDatabase (CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc DropDatabase   (DropDatabaseRequest)   returns (DropDatabaseResponse);

  rpc GetDatabaseInfo (GetDatabaseInfoRequest) returns (GetDatabaseInfoResponse);

  rpc CreateUser     (CreateUserRequest)     returns (CreateUserResponse);
  rpc DeleteUser     (DeleteUserRequest)     returns (DeleteUserResponse);
}

message PingRequest {
  DatabaseCredentials credentials = 1; // required when server security is enabled (enforced centrally by the auth interceptor)
}
message PingResponse {
  bool ok = 1;
  int64 server_time_ms = 2;
}

message GetServerInfoRequest {
  DatabaseCredentials credentials = 1;
}
message GetServerInfoResponse {
  string version         = 1; // e.g., "25.8.1-SNAPSHOT"
  string edition         = 2; // "CE"/"EE" if applicable
  int64  start_time_ms   = 3;
  int64  uptime_ms       = 4;
  int32  http_port       = 5; // -1 if not available
  int32  grpc_port       = 6; // -1 if not available
  int32  binary_port     = 7; // -1 if not available
  int32  databases_count = 8;
  map<string, string> features = 9; // optional flags
}

message ListDatabasesRequest {
  DatabaseCredentials credentials = 1;
}

message ListDatabasesResponse {
  repeated string databases = 1;
}

message ExistsDatabaseRequest {
  DatabaseCredentials credentials = 1;
  string name = 2; // database name
}
message ExistsDatabaseResponse {
  bool exists = 1;
}

message CreateDatabaseRequest {
  DatabaseCredentials credentials = 1;
  string name = 2; // database name
  string type = 3; // "graph" or "document" (logical)
}
message CreateDatabaseResponse {}

message DropDatabaseRequest {
  DatabaseCredentials credentials = 1;
  string name = 2; // database name
}
message DropDatabaseResponse {}

message GetDatabaseInfoRequest {
  DatabaseCredentials credentials = 1;
  string name = 2; // database name
}
message GetDatabaseInfoResponse {
  string database = 1;
  string type     = 2; // "graph"/"document"
  int64  records  = 3;
  int32  classes  = 4;
  int32  indexes  = 5;
  int64  size_bytes = 6; // optional if you can provide
  map<string, string> properties = 7; // extra info
}

message CreateUserRequest {
  DatabaseCredentials credentials = 1; // admin creds
  string user     = 2;
  string password = 3;
  string role     = 4; // optional, depending on your model
}
message CreateUserResponse {
  bool success = 1;
  string message = 2;
}

message DeleteUserRequest {
  DatabaseCredentials credentials = 1; // admin creds
  string user = 2;
}
message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}
