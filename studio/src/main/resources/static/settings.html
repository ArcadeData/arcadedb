<div class="tab-pane fade" id="tab-settings" role="tabpanel">
  <div class="studio-settings-panel">
    <h5><i class="fa fa-gear"></i> Settings</h5>

    <div class="studio-settings-section">
      <h6>Appearance</h6>
      <div style="margin-bottom: 8px; font-size: 0.82rem; color: var(--text-secondary);">Theme</div>
      <div class="theme-option-group" id="themeOptionGroup">
        <div class="theme-option" data-theme-value="light" data-on-click="applyTheme" data-args='["light"]'>
          <i class="fa fa-sun"></i> Light
        </div>
        <div class="theme-option" data-theme-value="dark" data-on-click="applyTheme" data-args='["dark"]'>
          <i class="fa fa-moon"></i> Dark
        </div>
        <div class="theme-option" data-theme-value="system" data-on-click="applyTheme" data-args='["system"]'>
          <i class="fa fa-desktop"></i> System
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/studio-settings.js"></script>
