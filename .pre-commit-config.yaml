repos:
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        # The support redactor's tests feed it PEM headers on purpose: they are the input it has to recognize, not keys
        exclude: ^server/src/test/java/com/arcadedb/server/support/Support(LogCollector|Redactor)Test\.java$
      - id: check-case-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: ^(k8s/|bindings/python/mkdocs\.yml$)
      - id: check-json
      - id: check-xml
  # native-image.yml's publishing steps run only on a published release, so a shell bug in one of
  # them is otherwise found by a release that silently fails to publish (#7282 shipped
  # `[ a || b ]` in the Docker push gate). actionlint runs shellcheck over every `run:` block.
  # Scoped to that one file because the other workflows still carry pre-existing findings.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/native-image\.yml$
  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        language_version: python3
        files: ^bindings/python/.*\.py$
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^bindings/python/.*\.py$
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args:
          - --autofix
          - --indent=2
        files: ^bindings/python/.*\.ya?ml$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-i", "4", "-ci", "-sr", "-w"]
        files: ^bindings/python/.*\.sh$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        types: [ java, xml ]
        additional_dependencies:
          - prettier@3.9.9
          - prettier-plugin-java@2.11.0
          - prettier-plugin-xml
        args:
          - --write
          - --list-different
          - --ignore-unknown
