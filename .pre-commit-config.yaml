repos:
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        # The support redactor's tests feed it PEM headers on purpose: they are the input it has to recognize, not keys
        exclude: ^server/src/test/java/com/arcadedb/server/support/Support(LogCollector|Redactor)Test\.java$
      - id: check-case-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: ^k8s/
      - id: check-json
      - id: check-xml
  # native-image.yml's publishing steps run only on a published release, so a shell bug in one of
  # them is otherwise found by a release that silently fails to publish (#7282 shipped
  # `[ a || b ]` in the Docker push gate). actionlint runs shellcheck over every `run:` block.
  # Every workflow is linted: mvn-deploy.yml and bolt-nightly.yml never run on a pull request, so a
  # schema error there surfaced only as deploy runs that failed to start (#10530). The shellcheck
  # findings that predate the wider scope are ignored per file and rule in .github/actionlint.yaml.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        types: [ java, xml ]
        additional_dependencies:
          - prettier@3.9.10
          - prettier-plugin-java@2.11.0
          - prettier-plugin-xml
        args:
          - --write
          - --list-different
          - --ignore-unknown
