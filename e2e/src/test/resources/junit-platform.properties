# ServerLogIT (@Order(Integer.MAX_VALUE)) scans the shared container's log once every other class has used it.
# That needs the classes to run one after the other in this one JVM: with parallel class execution (JUnit's
# junit.jupiter.execution.parallel.* or a Failsafe forkCount > 1) the scan could run before the others finish.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
