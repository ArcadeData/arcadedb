# Specify the handlers to create in the root logger
# (all loggers are children of the root logger)
# The following creates two handlers
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Set the default logging level for the root logger
.level = INFO
# Chaos diagnostics (-Dchaos.logConfig=src/test/resources/chaos/ratis-debug-log.properties): the default
# configuration pins GrpcLogAppender to SEVERE, which hides why a leader stops shipping entries to a follower.
# Here the leader's appenders log each request and reply, and the snapshot-install handshake is traced.
org.apache.ratis.grpc.server.GrpcLogAppender.level = FINE
org.apache.ratis.server.leader.level = FINE
org.apache.ratis.server.impl.LeaderStateImpl.level = FINE
org.apache.ratis.server.impl.SnapshotInstallationHandler.level = FINE
# NOTE (issue #6991): the sibling noise from
# org.apache.ratis.statemachine.impl.SimpleStateMachineStorage ("Snapshot file ... has missing MD5
# file.", expected because ArcadeDB's snapshot marker is a zero-byte placeholder) deliberately does
# NOT get a line here. That logger also reports genuine snapshot-directory I/O failures at WARNING,
# so pinning it to SEVERE would hide those too. It is suppressed per message instead, by
# com.arcadedb.server.ha.raft.ratis.RatisSnapshotDigestWarningFilter.
com.arcadedb.level = INFO

# Set the default logging level for new ConsoleHandler instances
java.util.logging.ConsoleHandler.level = FINE
# Set the default formatter for new ConsoleHandler instances
java.util.logging.ConsoleHandler.formatter = com.arcadedb.utility.AnsiLogFormatter

# Set the default logging level for new FileHandler instances
java.util.logging.FileHandler.level = FINE
# Naming style for the output file
java.util.logging.FileHandler.pattern=${arcadedb.server.logsDirectory}/arcadedb.log
# Set the default formatter for new FileHandler instances
java.util.logging.FileHandler.formatter = com.arcadedb.log.LogFormatter
# Limiting size of output file in bytes:
java.util.logging.FileHandler.limit=100000000
# Number of output files to cycle through, by appending an
# integer to the base file name:
java.util.logging.FileHandler.count=10
