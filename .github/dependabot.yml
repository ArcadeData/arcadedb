version: 2

# Alert triage note
# -----------------
# The repository's Dependabot auto-triage rule dismisses development-scope
# alerts for CWE-400 / CWE-770 / CWE-835 / CWE-674 (resource exhaustion), but
# NOT CWE-407 (inefficient algorithmic complexity) or CWE-22. That gap is why
# ReDoS-class advisories against test-only packages such as brace-expansion and
# js-yaml still surface as open alerts even though they are unreachable from any
# shipped artifact. Widening the rule to include CWE-407 for development scope
# is a Security -> Dependabot -> auto-triage rules setting in the GitHub UI and
# cannot be expressed in this file.

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 20
    ignore:
      # Groovy's version is dictated by TinkerPop, not by ArcadeDB. It appears
      # only in gremlin/pom.xml and gremlin-it/pom.xml; no other module in the
      # reactor uses it. gremlin-groovy 3.8.1 is built against the Groovy 4.0.x
      # line (TinkerPop 3.8.1 declares groovy.version 4.0.25), so Groovy 5 is a
      # major break that cannot be adopted until TinkerPop itself moves.
      #
      # Only majors are ignored. ArcadeDB deliberately runs 4.0.32, ahead of
      # TinkerPop's own 4.0.25, so 4.0.x patch and minor updates must keep
      # flowing.
      #
      # ANTLR is deliberately NOT listed here despite the same TinkerPop
      # coupling. antlr4.version is declared per-module with two different
      # intents: gremlin/pom.xml pins 4.9.1 because gremlin-language ships a
      # parser generated by the ANTLR 4.9.1 tool, and ANTLR 4.10 changed the
      # serialized ATN format, so a 4.13 runtime cannot read it. engine/pom.xml
      # independently tracks the latest (4.13.2) for its own grammar. Dependabot
      # ignore rules match dependency coordinates, not modules, and gremlin's
      # frozen 4.9.1 sits below the engine's current 4.13.2, so any range that
      # blocked the gremlin bump would silently freeze the engine too. The
      # gremlin ANTLR PR is closed by hand instead.
      - dependency-name: "org.apache.groovy:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/package/src/main/docker/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [ ">21" ]

  # Studio Frontend Dependencies (npm) - HIGH PRIORITY
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    target-branch: "main"
    commit-message:
      prefix: "chore(studio-deps)"
      prefix-development: "chore(studio-deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "studio"
      - "security"
      - "frontend"
    # Group related updates together for easier review
    groups:
      # Critical security libraries - immediate attention
      security-critical:
        patterns:
          - "jquery"
          - "bootstrap"
          - "datatables.net*"
          - "sweetalert2"
        update-types:
          - "patch"
          - "minor"
          - "major"
      # Visualization and UI libraries
      ui-visualization:
        patterns:
          - "cytoscape*"
          - "apexcharts"
          - "codemirror"
          - "notyf"
          - "clipboard"
          - "@fortawesome/*"
        update-types:
          - "patch"
          - "minor"
      # Build and development tools
      build-tools:
        patterns:
          - "webpack*"
          - "*-loader"
          - "*-plugin"
          - "copy-webpack-plugin"
          - "css-loader"
          - "style-loader"
          - "file-loader"
          - "url-loader"
          - "html-webpack-plugin"
        update-types:
          - "patch"
          - "minor"
    # Security-focused update strategy
    allow:
      - dependency-type: "all"
    # Controlled major version updates for stability
    ignore:
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]

  # Pre-commit hook versions
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # E2E JavaScript Testing Dependencies
  #
  # Everything here is test-harness only and never ships in a distribution.
  # Jest and testcontainers drag in a wide transitive tree (glob, minimatch,
  # brace-expansion, babel), so ungrouped patch bumps exhaust the PR limit and
  # bury the updates that matter. Group minor/patch into one PR per week and
  # let majors open individually, matching the /e2e-go convention.
  - package-ecosystem: "npm"
    directory: "/e2e-js"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      e2e-js-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # E2E Studio Testing Dependencies
  #
  # Playwright and testcontainers only; test-harness scope, never shipped.
  # Grouped for the same reason as /e2e-js above.
  - package-ecosystem: "npm"
    directory: "/e2e-studio"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      e2e-studio-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # E2E Python Testing Dependencies
  - package-ecosystem: "uv"
    directory: "/e2e-python"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # Bindings Python
  - package-ecosystem: "uv"
    directory: "/bindings/python"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # E2E Go Testing Dependencies
  - package-ecosystem: "gomod"
    directory: "/e2e-go"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    # Go's transitive tree (testcontainers-go pulls docker/containerd/grpc/otel)
    # is large; group minor/patch bumps into a single PR to keep noise down,
    # while major updates still open individually.
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Every file in /e2e-go is a *_test.go, so the module declares only three
    # direct requirements (neo4j-go-driver, testify, testcontainers-go) and
    # everything else is marked `// indirect`. Without this, version updates
    # only ever consider those three, and the transitive tree silently drifts
    # however far behind the direct deps' own floors allow.
    allow:
      - dependency-type: "all"
