version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 20
    ignore:
      # Groovy's version is dictated by TinkerPop, not by ArcadeDB. It appears
      # only in gremlin/pom.xml and gremlin-it/pom.xml; no other module in the
      # reactor uses it. gremlin-groovy 3.8.1 is built against the Groovy 4.0.x
      # line (TinkerPop 3.8.1 declares groovy.version 4.0.25), so Groovy 5 is a
      # major break that cannot be adopted until TinkerPop itself moves.
      #
      # Only majors are ignored. ArcadeDB deliberately runs 4.0.32, ahead of
      # TinkerPop's own 4.0.25, so 4.0.x patch and minor updates must keep
      # flowing.
      #
      # ANTLR is deliberately NOT listed here despite the same TinkerPop
      # coupling. antlr4.version is declared per-module with two different
      # intents: gremlin/pom.xml pins 4.9.1 because gremlin-language ships a
      # parser generated by the ANTLR 4.9.1 tool, and ANTLR 4.10 changed the
      # serialized ATN format, so a 4.13 runtime cannot read it. engine/pom.xml
      # independently tracks the latest (4.13.2) for its own grammar. Dependabot
      # ignore rules match dependency coordinates, not modules, and gremlin's
      # frozen 4.9.1 sits below the engine's current 4.13.2, so any range that
      # blocked the gremlin bump would silently freeze the engine too. The
      # gremlin ANTLR PR is closed by hand instead.
      #
      # The GraalVM Truffle/polyglot coordinates (org.graalvm.*) are unlisted for
      # the same reason. THREE places carry this version and all three must move
      # in one commit: native/pom.xml's native.graalvm.version,
      # engine/pom.xml's graalvm.version, and the builder pinned by
      # native-image.yml's java-version. A mismatch between the artifacts and
      # the builder aborts the image build with NoSuchMethodError
      # getLoopNodeFactory(), naming neither side. A GraalVM PR is therefore
      # reviewed by hand: merge it only when it moves all three, otherwise close
      # it. Bumps 3fecba4bf (-> 25.2.4) and b53c48c1e2 (-> 25.3.4.1) both did
      # exactly this wrong and broke every native leg.
      #
      # A bump is not impossible, just not a one-line edit. native-image.yml
      # pins the builder through setup-graalvm's `java-version` input, which
      # reaches jdk-* releases only - deliberately, because that is GraalVM's
      # MAINLINE line and the one the OS packagers carry, so a contributor can
      # install the matching builder and run a local native build. The other
      # input, `version`, additionally reaches the intermediate graal-* releases;
      # the pin used it while it tracked graal-25.2.4.
      #
      # Two traps for whoever raises the pin next. Its tag must parse as
      # three-component semver - graal-25.3.4.1 is reachable through neither
      # input, because node-semver rejects its four numeric components. And the
      # version must exist as a CE TARBALL, which being on Maven Central does
      # not imply: 25.0.3 and 25.0.4 publish the full org.graalvm.* set and were
      # never released as a distribution, so a pin bumped to either resolves
      # cleanly in Maven and then has no builder to match, on any platform.
      #
      # Two guards now back that up, because "reviewed by hand" was not one:
      # .github/scripts/check-native-graalvm-pin.py fails the always-on `lint`
      # job on any skew, and .mergify.yml no longer auto-merges a Dependabot PR
      # that touches native/pom.xml.
      - dependency-name: "org.apache.groovy:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/package/src/main/docker/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [ ">21" ]

  # Studio Frontend Dependencies (npm) - HIGH PRIORITY
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    target-branch: "main"
    commit-message:
      prefix: "chore(studio-deps)"
      prefix-development: "chore(studio-deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "studio"
      - "security"
      - "frontend"
    # Group related updates together for easier review
    groups:
      # Critical security libraries - immediate attention
      security-critical:
        patterns:
          - "jquery"
          - "bootstrap"
          - "datatables.net*"
          - "sweetalert2"
        update-types:
          - "patch"
          - "minor"
          - "major"
      # Visualization and UI libraries
      ui-visualization:
        patterns:
          - "cytoscape*"
          - "apexcharts"
          - "codemirror"
          - "notyf"
          - "clipboard"
          - "@fortawesome/*"
        update-types:
          - "patch"
          - "minor"
      # Build and development tools
      build-tools:
        patterns:
          - "webpack*"
          - "*-loader"
          - "*-plugin"
          - "copy-webpack-plugin"
          - "css-loader"
          - "style-loader"
          - "file-loader"
          - "url-loader"
          - "html-webpack-plugin"
        update-types:
          - "patch"
          - "minor"
    # Security-focused update strategy
    allow:
      - dependency-type: "all"
    # Controlled major version updates for stability
    ignore:
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]

  # Pre-commit hook versions
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # E2E JavaScript Testing Dependencies
  - package-ecosystem: "npm"
    directory: "/e2e-js"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # E2E Studio Testing Dependencies
  - package-ecosystem: "npm"
    directory: "/e2e-studio"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # E2E Python Testing Dependencies
  - package-ecosystem: "uv"
    directory: "/e2e-python"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # Bindings Python
  - package-ecosystem: "uv"
    directory: "/bindings/python"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10

  # E2E Go Testing Dependencies
  - package-ecosystem: "gomod"
    directory: "/e2e-go"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    # Go's transitive tree (testcontainers-go pulls docker/containerd/grpc/otel)
    # is large; group minor/patch bumps into a single PR to keep noise down,
    # while major updates still open individually.
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
