name: VEX Validate

on:
  pull_request:
    paths:
      - 'vex/**'
      - '.github/scripts/check-vex.sh'
      - '.github/workflows/vex-validate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VEX document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A malformed document is not noticed until the release gate runs grype with it, hours before a release.
      # The binary is pinned by version and checked against its published SHA-256, so a replaced release asset fails.
      - name: Install vexctl
        run: |
          curl -sSfL -o vexctl https://github.com/openvex/vexctl/releases/download/v0.4.4/vexctl-linux-amd64
          echo "d315e2778af88b999ad4bba30a08aa2677ed701638e16c341b6d57b43c1e064d  vexctl" | sha256sum -c -
          chmod +x vexctl

      - name: Parse the document with vexctl
        run: ./vexctl merge vex/arcadedb.openvex.json > /dev/null

      # not_affected without a justification and an impact statement would silence a critical CVE with no reason.
      - name: Check required fields
        run: .github/scripts/check-vex.sh vex/arcadedb.openvex.json
