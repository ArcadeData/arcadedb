# Fails when an ignore pattern matches a tracked file. Such a file stays versioned only because it predates
# the pattern, while anything new next to it is silently skipped by `git add` and hidden from every
# ignore-aware search tool (ripgrep, IDE project search). The symptom is the ABSENCE of output from unrelated
# commands, so nothing but this check notices it: an unanchored `**/log` once hid the whole
# com.arcadedb.log source package (#9981).
#
# Fix a failure by anchoring the pattern to where it is meant to apply, or by adding a `!` negation for the
# source path it must not cover. Do not untrack the file unless it really is a generated artifact.
name: Gitignore hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel this PR's superseded run on a new push; other events are keyed by SHA and never cancel
# each other. Rationale in mvn-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-tracked-file-ignored:
    name: No tracked file matches .gitignore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no tracked file is matched by an ignore pattern
        run: |
          # --no-index evaluates the patterns against tracked paths too (by default check-ignore exempts them).
          # Exit status 1 means "nothing matched", which is the pass case, so test the output, not the status.
          matched="$(git ls-files | git check-ignore --no-index --stdin || true)"
          if [ -n "$matched" ]; then
            echo "::error::Tracked files are matched by an ignore pattern (responsible line shown):"
            printf '%s\n' "$matched" | git check-ignore --no-index --verbose --stdin || true
            exit 1
          fi
          echo "No tracked file is matched by any .gitignore pattern."

      # The step above only sees files already committed: a new file under an ignored package with no tracked sibling never
      # reaches the index, so it cannot fail it. This one is computed from the patterns, for every source tree (#10162)
      - name: Assert no ignore pattern hides a directory under a source tree
        run: ./.github/scripts/check-gitignore-src-paths.sh
