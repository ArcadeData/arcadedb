name: Java CI - deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'

permissions:
  contents: read

# One deploy at a time, never cancelled: a cancel could stop a Maven Central or Docker Hub push
# halfway. While one runs, GitHub keeps only the NEWEST pending run and drops older pending ones,
# which is what a deploy wants - an older run can no longer finish last and overwrite `latest`
# with a staler build.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # -Dmaven.repository.credentialScope=id (#10023): Maven 3.10 binds the credentials of server
      # 'central' to Maven Central's own origin (https://repo.maven.apache.org) and refuses to send them
      # anywhere else, so the snapshot upload to https://central.sonatype.com reached the server with
      # no credentials and got HTTP 401 on every run since the runner image moved from Maven 3.9.16 to
      # 3.10.0 (2026-10-08). The flag restores the id-only matching every earlier deploy relied on, and
      # is ignored by Maven 3.9. .github/scripts/check-deploy-credential-scope.py keeps it here.
      # ./mvnw, not the runner's mvn (#10134): the runner image's Maven upgrade is what broke this
      # step in the first place. The wrapper pins Maven 3.10.0 too, so the flag above is still needed.
      # .github/scripts/check-maven-wrapper.py keeps every workflow on the wrapper.
      - name: Publish to OSS and Docker hub
        run: ./mvnw deploy -Pdeploy -Pdocker -pl !e2e  --batch-mode  --errors --fail-at-end --show-version  --file pom.xml -DskipTests -Dmaven.repository.credentialScope=id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: E2E Test
        if: success()
        run: ./mvnw verify -pl e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
