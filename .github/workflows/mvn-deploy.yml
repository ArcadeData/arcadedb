name: Java CI - deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'

permissions:
  contents: read

# One deploy at a time, never cancelled: a cancel could stop a Maven Central or Docker Hub push
# halfway. While one runs, GitHub keeps only the NEWEST pending run and drops older pending ones,
# which is what a deploy wants - an older run can no longer finish last and overwrite `latest`
# with a staler build.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.0"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # -Dmaven.repository.credentialScope=id (#10023): Maven 3.10 binds the credentials of server
      # 'central' to Maven Central's own origin (https://repo.maven.apache.org) and refuses to send them
      # anywhere else, so the snapshot upload to https://central.sonatype.com reached the server with
      # no credentials and got HTTP 401 on every run since the runner image moved from Maven 3.9.16 to
      # 3.10.0 (2026-10-08). The flag restores the id-only matching every earlier deploy relied on, and
      # is ignored by Maven 3.9. .github/scripts/check-deploy-credential-scope.py keeps it here.
      - name: Publish to OSS and Docker hub
        run: mvn deploy -Pdeploy -Pdocker -pl !e2e  --batch-mode  --errors --fail-at-end --show-version  --file pom.xml -DskipTests -Dmaven.repository.credentialScope=id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: E2E Test
        if: success()
        run: mvn verify -pl e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
