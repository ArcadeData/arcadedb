name: Supply-chain Scan

# Nightly, because a critical CVE published tomorrow must not wait for the next release to be noticed: the release gate
# only runs when somebody releases. No signing or attestation here, those are for releases only.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan main
    if: github.repository == 'ArcadeData/arcadedb'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Read the project version
        id: version
        run: echo "version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Same pinned scanner as the release preflight, so the nightly predicts the verdict of the release.
      - name: Install grype
        run: |
          curl -sSfL -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  grype.tar.gz" | sha256sum -c -
          sudo tar -xzf grype.tar.gz -C /usr/local/bin grype

      - name: Scan main
        run: .github/scripts/release-scan.sh "${{ steps.version.outputs.version }}"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-scan
          path: package/target/scan/*.json
          if-no-files-found: ignore

  # A separate job so only this one holds issues: write, and no build step runs with it.
  report:
    name: Report failure
    needs: scan
    if: github.repository == 'ArcadeData/arcadedb' && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # One open issue is reused, so a vulnerability that stays unfixed for a week is one thread, not seven.
      - name: Create or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly supply-chain scan failed"
          body="The nightly supply-chain scan of main failed. Details are in the run summary: ${RUN_URL}"
          number=$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
