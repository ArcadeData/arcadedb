name: License Compliance Check

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger
  pull_request:
    # Run on PRs that modify dependencies
    paths:
      - '**/pom.xml'
      - 'NOTICE'
      - 'ATTRIBUTIONS.md'

permissions:
  contents: read

jobs:
  license-check:
    name: Check License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Buid jars
        run: ./mvnw clean install  -DskipTests --batch-mode --errors  --show-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No version is pinned here: that lets Maven resolve org.codehaus.mojo:license-maven-plugin
      # against the version and <configuration> (<licenseMerges>, <excludedLicenses>) declared for
      # it in the root pom.xml, instead of running with an unconfigured, unrelated pinned version
      # as a bare CLI invocation. It also aggregates the whole reactor rather than just the root
      # aggregator pom's own (near-empty) direct dependencies, which is what both checks below need.
      - name: Generate aggregated third-party license report
        run: |
          echo "Generating aggregated license report for the whole reactor..."
          mvn org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party -DskipTests
        continue-on-error: false

      # #5651: this allow-list check replaces the previous "grep for GPL/AGPL/SSPL" deny-only step.
      # An allow-list is strictly stronger than a deny-list (anything not allowed is denied, whatever
      # it is called), and a naive substring grep for "GPL" would mis-fire the moment this workflow
      # started looking at the real aggregated report: dependencies this project already ships, e.g.
      # org.openjdk.jmh (test/benchmark scope) and javax.annotation-api, declare licenses that merely
      # *mention* GPL in passing ("... with the Classpath exception", "CDDL + GPLv2 with classpath
      # exception") - see check-license-allowlist.py's ALLOWED_CLAUSES docstring for the full
      # reasoning. Before #5651 this Maven-side check had never actually seen the real dependency
      # graph either: it ran against the root aggregator pom's own (near-empty, test-scope-only)
      # direct dependencies, because add-third-party is a no-op for `pom`-packaged projects.
      - name: Check for licenses outside the allow-list
        run: |
          echo "Checking that every dependency license is on ArcadeDB's allow-list (CLAUDE.md)..."
          .github/scripts/check-license-allowlist.py target/generated-sources/license/THIRD-PARTY.txt

      - name: Download license files
        run: |
          echo "Downloading license files..."
          mvn org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses -DskipTests
        continue-on-error: true

      - name: Sanitize license filenames for upload-artifact compatibility
        if: always()
        run: |
          # upload-artifact forbids: " : < > | * ? \r \n in filenames
          find target/generated-resources/licenses/ -type f 2>/dev/null | while IFS= read -r f; do
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            sanitized="$(printf '%s' "$base" | sed 's/[":<>|*?]/_/g')"
            if [ "$base" != "$sanitized" ]; then
              echo "Renaming: $base -> $sanitized"
              mv "$f" "$dir/$sanitized"
            fi
          done

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-compliance-report
          path: |
            target/generated-sources/license/
            target/generated-resources/licenses/
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📜 License Compliance Check\n\n';

            try {
              const report = fs.readFileSync('target/generated-sources/license/THIRD-PARTY.txt', 'utf8');
              const lines = report.split('\n').slice(0, 50);
              comment += '✅ License check passed. See artifacts for full report.\n\n';
              comment += '<details><summary>License Summary (first 50 lines)</summary>\n\n```\n';
              comment += lines.join('\n');
              comment += '\n```\n</details>';
            } catch (error) {
              comment += '⚠️ Could not read license report.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        if: always()
        run: |
          echo "### License Compliance Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Reports generated:**" >> $GITHUB_STEP_SUMMARY
          echo "- Aggregated third-party licenses list (allow-list checked against CLAUDE.md)" >> $GITHUB_STEP_SUMMARY
          echo "- Downloaded license texts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the 'license-compliance-report' artifact to review full details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **How to review locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "mvn org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party" >> $GITHUB_STEP_SUMMARY
          echo "cat target/generated-sources/license/THIRD-PARTY.txt" >> $GITHUB_STEP_SUMMARY
          echo ".github/scripts/check-license-allowlist.py target/generated-sources/license/THIRD-PARTY.txt" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
