name: Java CI - test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'
  push:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@46cfe808a5f1588656ef299eedd0ce2fd7ec0dcc # v5.0.6
      - name: Check test database paths
        run: ./.github/scripts/check-test-database-paths.sh
      - name: Run pre-commit
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.0"
          cache: "pip"
      # Every step below needs PyYAML, so it gets its own step rather than hiding inside the first
      # one that happens to run - reordering those would otherwise break the rest confusingly.
      # Pinned for the same reason the actions here are pinned to a SHA: this job gates every other
      # one, so what it installs should not change under it between runs.
      - name: Install workflow linting dependencies
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Check workflow artifact dependencies
        run: ./.github/scripts/check-workflow-artifact-deps.py
      - name: Check test reporter guards
        run: ./.github/scripts/check-test-reporter-guards.py
      - name: Check CI scripts
        run: ./.github/scripts/tests/test-ci-scripts.sh
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build-and-package:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get project version
        id: get-version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build and package with Maven Docker profile
        run: ./mvnw clean install -Pdocker -DskipTests --batch-mode --errors  --show-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save docker image
        run: docker save arcadedata/arcadedb:latest > /tmp/arcadedb-image.tar

      # Artifacts, not the cache. Both of these move data from this job to the jobs that need it within
      # THIS run - they are not reusable by any other run, because a later run rebuilds them. Keying them
      # on github.run_id made that explicit and put them in the wrong store: the Actions cache is a fixed
      # 10 GB per repository with LRU eviction, so a few concurrent runs evicted an entry minutes after it
      # was written and every e2e job then died on `docker load` with "No such file or directory" (#5672).
      # Artifacts are scoped to the run and are not evicted, which is the property this needs.
      - name: Upload docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp/arcadedb-image.tar
          retention-days: 1
          # Docker layers are already compressed; a second pass costs minutes and saves almost nothing.
          compression-level: 0

      # Only what this build produced, not the whole repository. Third-party dependencies come from the
      # Maven cache that setup-java restores in each downstream job, so shipping all of ~/.m2 duplicated
      # ~1.9 GB per run to say nothing the receiving job did not already have.
      - name: Package ArcadeDB Maven artifacts
        run: tar -czf /tmp/arcadedb-m2.tgz -C ~/.m2/repository com/arcadedb

      - name: Upload ArcadeDB Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp/arcadedb-m2.tgz
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    # A hung test used to burn the workflow's whole budget in silence (run 29645471373 sat for
    # 2h15m on a deadlocked shared thread pool). Cap the job so a hang costs minutes, not hours.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run Unit Tests with Coverage
        # package phase runs surefire (test) and JaCoCo report (prepare-package) without reaching integration-test phase
        # A watchdog dumps every JVM's stacks before the job timeout fires. Without it a deadlocked
        # surefire fork produces no output at all, so there is nothing to diagnose after the fact.
        run: |
          (
            sleep 2700
            # Repeats until killed: a single dump at 45m would show a healthy build and tell us
            # nothing about a hang that only begins afterwards.
            while true; do
              echo "::warning::Unit tests still running - dumping JVM thread stacks"
              for pid in $(jps -q 2>/dev/null); do
                echo "===== jstack $pid ====="
                jstack "$pid" 2>&1 || true
              done
              sleep 300
            done
          ) &
          watchdog=$!
          set +e
          ./mvnw verify -Pcoverage --batch-mode --errors --fail-never --show-version -pl !e2e,!load-tests -DexcludedGroups=slow,benchmark -Dsurefire.includes=**/*Test.java,**/*Suite.java
          status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A test that derives its path from SERVER_ROOT_PATH cannot be caught by the static grep in
      # the setup job - only the directory it leaves behind proves it wrote outside target/.
      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # continue-on-error: publishing the report talks to the GitHub API, and an outage there says
      # nothing about the tests. The step below is what decides the job, so losing the annotations
      # no longer costs a false red - and cannot buy a false green either.
      - name: Unit Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: "**/surefire-reports/TEST*.xml"
          only-summary: 'true'
          list-tests: 'failed'
          list-suites: 'failed'
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      - name: Upload unit test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-reports
          path: |
            **/jacoco*.xml
          retention-days: 1

  slow-unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run Slow Unit Tests with Coverage
        run: ./mvnw package -Pcoverage --batch-mode --errors --fail-never --show-version -pl engine  -Dgroups=slow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: Unit Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: "**/surefire-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      - name: Upload unit test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-unit-coverage-reports
          path: |
            **/jacoco*.xml
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run Integration Tests with Coverage
        run: ./mvnw verify -DskipTests -Pintegration -Pcoverage  --batch-mode --errors --fail-never --show-version -pl !e2e,!load-tests,!e2e-ha,!ha-raft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The server ITs derive their database dir from SERVER_ROOT_PATH, which the static grep cannot
      # resolve. This job is where that pattern actually runs, so the backstop matters most here.
      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: IT Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: IT Tests Report
          path: "**/failsafe-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py failsafe-reports

      - name: Upload integration test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage-reports
          path: |
            **/jacoco*.xml
          retention-days: 1

  ha-integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run HA Integration Tests with Coverage
        run: ./mvnw verify -DskipTests -Pintegration -Pcoverage  --batch-mode --errors --fail-never --show-version -pl ha-raft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: HA IT Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: HA IT Tests Report
          path: "**/failsafe-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py failsafe-reports

      - name: Upload HA integration test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-integration-coverage-reports
          path: |
            **/jacoco*.xml
          retention-days: 1

  builder-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Build packages for Builder Tests
        run: ./mvnw clean package -DskipTests --batch-mode --errors  --show-version

      - name: Run Builder Tests
        working-directory: package
        run: ./test-builder-local.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      - name: E2E Tests
        run: ./mvnw verify -Pintegration -pl e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # continue-on-error: same reasoning as the unit-tests job, with a different verdict step. The
      # e2e suites do not run with --fail-never, so the test step above already fails the job on a
      # failing test and no check-test-results.py is needed. The reporter only publishes annotations,
      # so letting it fail removes the false red without ever hiding a real failure.
      - name: E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: Java E2E Tests Report
          path: "e2e/target/failsafe-reports/TEST*.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

  js-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24.9+ required: testcontainers@12 pulls archiver@8 (pure ESM), and
          # Jest's require(ESM) bridge only works on Node 24.9+ (synchronous vm module APIs).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "e2e-js/package-lock.json"

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      - name: E2E Node.js Tests
        working-directory: e2e-js
        run: |
          npm ci
          npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # See the java-e2e-tests job: the test step is the verdict, the reporter is decorative.
      - name: JS E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: JS E2E Tests Report
          path: "e2e-js/reports/jest-junit.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

      - name: Upload JS E2E JUnit report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-e2e-junit
          path: e2e-js/reports/jest-junit.xml
          retention-days: 7

  studio-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "e2e-studio/package-lock.json"

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      - name: Install Playwright Browsers
        working-directory: e2e-studio
        run: |
          npm ci
          npm run install-browsers

      - name: E2E Studio Tests
        working-directory: e2e-studio
        run: |
          npm run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # See the java-e2e-tests job: the test step is the verdict, the reporter is decorative.
      - name: Studio E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: Studio E2E Tests Report
          path: "e2e-studio/reports/playwright-junit.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

      - name: Upload Studio E2E test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-e2e-artifacts
          path: |
            e2e-studio/test-results/
            e2e-studio/playwright-report/
          retention-days: 7

  python-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.0"
          cache: "pip"
          cache-dependency-path: "e2e-python/requirements*.txt"

      - name: Setup UV package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      - name: E2E Python Tests
        working-directory: e2e-python
        run: |
          uv pip install --system -e .
          uv pip install --system pytest
          mkdir -p reports
          pytest tests/ --junitxml=reports/python-junit.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # See the java-e2e-tests job: the test step is the verdict, the reporter is decorative.
      - name: Python E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: Python E2E Tests Report
          path: "e2e-python/reports/python-junit.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

      - name: Upload Python E2E JUnit report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-e2e-junit
          path: e2e-python/reports/python-junit.xml
          retention-days: 7

  csharp-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0"
          cache: true
          cache-dependency-path: "e2e-csharp/ArcadeDB.E2ETests/ArcadeDB.E2ETests.csproj"

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      - name: E2E C# Tests
        working-directory: e2e-csharp/ArcadeDB.E2ETests
        # Absolute LogFilePath: JunitXml.TestLogger resolves a relative path
        # against the results directory in some versions, which would land the
        # file where the reporter/convert step does not look.
        run: |
          mkdir -p reports
          dotnet test --logger "trx;LogFileName=test-results.trx" --logger "junit;LogFilePath=${{ github.workspace }}/e2e-csharp/ArcadeDB.E2ETests/reports/csharp-junit.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # See the java-e2e-tests job: the test step is the verdict, the reporter is decorative.
      - name: C# E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: C# E2E Tests Report
          path: "e2e-csharp/ArcadeDB.E2ETests/reports/csharp-junit.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

      - name: Upload C# E2E JUnit report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-e2e-junit
          path: e2e-csharp/ArcadeDB.E2ETests/reports/csharp-junit.xml
          retention-days: 7

  go-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the module's go directive so the toolchain always matches
          # go.mod instead of a hardcoded version that can drift after dep bumps.
          go-version-file: "e2e-go/go.mod"
          cache-dependency-path: "e2e-go/go.sum"

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/arcadedb-image.tar

      # The TLS scenarios (CONN-002/005) generate a keystore with keytool. It
      # ships with the JDK preinstalled on ubuntu-latest; fail loudly here if it
      # ever leaves the PATH, so those scenarios can't silently skip in CI.
      - name: Verify keytool is available (required by TLS scenarios)
        run: command -v keytool

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: E2E Go Tests
        working-directory: e2e-go
        # 20m timeout: the plain container plus a derived-image build and two
        # TLS containers (150s startup each) run sequentially and can approach
        # the default 10m per-package deadline on a shared runner.
        run: |
          mkdir -p reports
          gotestsum --junitfile reports/go-junit.xml --format standard-verbose -- -timeout 20m ./...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADEDB_DOCKER_IMAGE: ${{ needs.build-and-package.outputs.image-tag }}

      # See the java-e2e-tests job: the test step is the verdict, the reporter is decorative.
      - name: Go E2E Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        continue-on-error: true
        with:
          name: Go E2E Tests Report
          path: "e2e-go/reports/go-junit.xml"
          list-suites: "failed"
          list-tests: "failed"
          reporter: java-junit

      - name: Upload Go E2E JUnit report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-e2e-junit
          path: e2e-go/reports/go-junit.xml
          retention-days: 7

  # Merges the JaCoCo reports of every test suite and publishes the union.
  #
  # `needs` must list every job whose coverage is downloaded below. It is not an optimisation: a
  # download only sees artifacts already uploaded, so a producer missing from this list is a race
  # the merge loses whenever that job is the slow one. ha-integration-tests was missing here and
  # takes ~55 minutes - the longest job in the workflow - so its reports were usually absent and
  # the whole ha-raft module was published as uncovered (#5701). check-workflow-artifact-deps.py
  # in the setup job now enforces the rule for every workflow.
  coverage-report:
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests, slow-unit-tests, ha-integration-tests ]
    # Coverage is still worth publishing when a suite reported failing tests: the suites run with
    # --fail-never, so JaCoCo writes its report and the job records the failure afterwards.
    #
    # A suite that was *skipped* is different. It produced no report because it never ran at all -
    # most likely build-and-package failed - so there is nothing to merge, and reporting that as a
    # missing artifact would only add a second red check to an already-red build. Skipping keeps
    # the collector's failure meaning what it says: a suite that should have uploaded, and did not.
    #
    # This reads any one skipped suite as "none of them ran", which holds because all four hang off
    # build-and-package and so skip together. Give one of them a path filter or a condition of its
    # own and that stops being true: the other three would still have coverage worth publishing,
    # and this condition would drop it. Revisit here if a suite ever gains its own gate.
    if: >-
      ${{ !cancelled()
      && needs.unit-tests.result != 'skipped'
      && needs.slow-unit-tests.result != 'skipped'
      && needs.integration-tests.result != 'skipped'
      && needs.ha-integration-tests.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # continue-on-error keeps a missing artifact from failing the step with a bare "Artifact not
      # found", so the collector below can report which suite is missing and why it matters.
      - name: Download unit test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: unit-coverage-reports
          path: unit-coverage

      - name: Download slow unit test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: slow-unit-coverage-reports
          path: slow-unit-coverage


      - name: Download integration test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: integration-coverage-reports
          path: integration-coverage


      - name: Download HA integration test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ha-integration-coverage-reports
          path: ha-integration-coverage

      # Fails when a suite contributed no report, so nothing downstream publishes a merge that is
      # missing a module. The steps below deliberately carry no `if`, so they are skipped on failure.
      - name: Get coverage files
        id: coverage-files-generator
        run: |
          ./.github/scripts/collect-coverage-reports.sh \
            unit-tests=unit-coverage \
            slow-unit-tests=slow-unit-coverage \
            integration-tests=integration-coverage \
            ha-integration-tests=ha-integration-coverage

      - name: Codacy coverage reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          language: java
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage-files-generator.outputs.COVERAGE_FILES }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          disable_search: true
          files: ${{ steps.coverage-files-generator.outputs.COVERAGE_FILES }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ArcadeData/arcadedb
          verbose: true
