name: Java CI - test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'
  push:
    branches:
      - main
    # Skip if only Python bindings change
    paths-ignore:
      - 'bindings/python/**'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4
      - name: Check test database paths
        run: ./.github/scripts/check-test-database-paths.sh
      - name: Run pre-commit
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.0"
          cache: "pip"
      # Every step below needs PyYAML, so it gets its own step rather than hiding inside the first
      # one that happens to run - reordering those would otherwise break the rest confusingly.
      # Pinned for the same reason the actions here are pinned to a SHA: this job gates every other
      # one, so what it installs should not change under it between runs.
      - name: Install workflow linting dependencies
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Check workflow artifact dependencies
        run: ./.github/scripts/check-workflow-artifact-deps.py
      - name: Check workflow needs outputs
        run: ./.github/scripts/check-workflow-needs-outputs.py
      - name: Check test reporter guards
        run: ./.github/scripts/check-test-reporter-guards.py
      - name: Check source files for raw control bytes
        run: ./.github/scripts/check-source-control-chars.py
      - name: Check CI scripts
        run: ./.github/scripts/tests/test-ci-scripts.sh
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build-and-package:
    runs-on: ubuntu-latest
    needs: setup
    # Seven downstream jobs pass `needs.build-and-package.outputs.image-tag` as
    # ARCADEDB_DOCKER_IMAGE, but this block did not exist, so all seven were handed an EMPTY string.
    # It went unnoticed because every consumer is defensive in a way that hides it: e2e-go guards
    # `!= ""`, js-bolt-conformance uses `|| "arcadedata/arcadedb:latest"`, and js-pg / js-bolt
    # hardcode `:latest` and ignore the variable entirely. Since `Save docker image` below saves
    # ONLY the :latest tag, those fallbacks happen to land on the freshly built image, so the suites
    # tested the right thing by luck rather than by instruction. The documented intent - e2e-go's
    # README says "the branch-built image is docker loaded under the tag passed via
    # ARCADEDB_DOCKER_IMAGE" - has never actually held.
    #
    # :latest is the correct value rather than the project version, because the artifact carries no
    # other tag: `docker load` in a consuming job makes :latest the only reference that resolves.
    outputs:
      image-tag: arcadedata/arcadedb:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Cache local Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Get project version
        id: get-version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build and package with Maven Docker profile
        run: ./mvnw clean install -Pdocker -DskipTests --batch-mode --errors  --show-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save docker image
        run: docker save arcadedata/arcadedb:latest > /tmp/arcadedb-image.tar

      # Artifacts, not the cache. Both of these move data from this job to the jobs that need it within
      # THIS run - they are not reusable by any other run, because a later run rebuilds them. Keying them
      # on github.run_id made that explicit and put them in the wrong store: the Actions cache is a fixed
      # 10 GB per repository with LRU eviction, so a few concurrent runs evicted an entry minutes after it
      # was written and every e2e job then died on `docker load` with "No such file or directory" (#5672).
      # Artifacts are scoped to the run and are not evicted, which is the property this needs.
      - name: Upload docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcadedb-docker-image
          path: /tmp/arcadedb-image.tar
          retention-days: 1
          # Docker layers are already compressed; a second pass costs minutes and saves almost nothing.
          compression-level: 0

      # Only what this build produced, not the whole repository. Third-party dependencies come from the
      # Maven cache that setup-java restores in each downstream job, so shipping all of ~/.m2 duplicated
      # ~1.9 GB per run to say nothing the receiving job did not already have.
      - name: Package ArcadeDB Maven artifacts
        run: tar -czf /tmp/arcadedb-m2.tgz -C ~/.m2/repository com/arcadedb

      - name: Upload ArcadeDB Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp/arcadedb-m2.tgz
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    # A hung test used to burn the workflow's whole budget in silence (run 29645471373 sat for
    # 2h15m on a deadlocked shared thread pool). Cap the job so a hang costs minutes, not hours.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run Unit Tests with Coverage
        # package phase runs surefire (test) and JaCoCo report (prepare-package) without reaching integration-test phase
        # A watchdog dumps every JVM's stacks before the job timeout fires. Without it a deadlocked
        # surefire fork produces no output at all, so there is nothing to diagnose after the fact.
        #
        # This lane is the complement of the three engine-only lanes below, and the split is what keeps it
        # inside its 60-minute budget: `slow` and `benchmark` as before, `vector` for the three vector-index
        # classes, and `**/*Suite.java` dropped from the includes so the openCypher TCK moves to its own job.
        # The TCK is excluded by PATTERN and not by a tag on purpose - see the javadoc on OpenCypherTCKSuite
        # for the measurement that rules a tag out.
        #
        # -Dmaven.test.failure.ignore=true is what keeps coverage alive when a test fails, and it is NOT
        # redundant with --fail-never. --fail-never only stops a failed module from failing the reactor; the
        # module itself still halts at the phase that failed. Surefire runs at `test`, JaCoCo's report goal at
        # `prepare-package` (see the coverage profile in the root pom), so one failing test means that module
        # writes no jacoco.xml at all. The upload step below then matches nothing, defaults to a warning, and
        # publishes no artifact - which the collector in coverage-report reads as "this suite covered nothing".
        # That is how run 31308335842 lost the whole vector lane's engine coverage to four flaky timeouts.
        # Failsafe does not have this problem, which is why the integration lanes need no such flag: it defers
        # its failure to `verify`, well after report-integration has run at post-integration-test.
        #
        # This does not soften the verdict on failing tests. Maven already exited 0 under --fail-never; the
        # "Check test results" step below reads the surefire XML off disk and is the only thing that decides
        # the job. It still fails on exactly the same reports.
        run: |
          (
            sleep 2700
            # Repeats until killed: a single dump at 45m would show a healthy build and tell us
            # nothing about a hang that only begins afterwards.
            while true; do
              echo "::warning::Unit tests still running - dumping JVM thread stacks"
              for pid in $(jps -q 2>/dev/null); do
                echo "===== jstack $pid ====="
                jstack "$pid" 2>&1 || true
              done
              sleep 300
            done
          ) &
          watchdog=$!
          set +e
          ./mvnw verify -Pcoverage --batch-mode --errors --fail-never --show-version -Dmaven.test.failure.ignore=true -pl !e2e,!load-tests -DexcludedGroups=slow,benchmark,vector -Dsurefire.includes=**/*Test.java
          status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A test that derives its path from SERVER_ROOT_PATH cannot be caught by the static grep in
      # the setup job - only the directory it leaves behind proves it wrote outside target/.
      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # continue-on-error: publishing the report talks to the GitHub API, and an outage there says
      # nothing about the tests. The step below is what decides the job, so losing the annotations
      # no longer costs a false red - and cannot buy a false green either.
      - name: Unit Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: "**/surefire-reports/TEST*.xml"
          only-summary: 'true'
          list-tests: 'failed'
          list-suites: 'failed'
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      # A red lane has to name the failing test without a re-run. The reporter check run above is
      # best-effort by design - an API outage makes it a no-op - the per-job log endpoint serves only
      # runner setup and cleanup while any job of the run is still in flight, and nothing else this lane
      # uploads carries a per-test verdict. The report XML is exactly the answer to "which test failed",
      # so it is kept whenever the lane goes red (issue #6322).
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/surefire-reports/TEST*.xml
          # A step that failed before Maven wrote any report has nothing to keep, and the red already
          # belongs to that step: an empty match here must not add a second, misleading failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-reports
          path: |
            **/jacoco*.xml
          # upload-artifact's default for an empty match is `warn`: it prints a notice, publishes no
          # artifact, and leaves the step green. That is how a lane that produced no coverage used to look
          # exactly like one that did, with the absence only surfacing two jobs later in the collector - as
          # a failure attributed to coverage-report rather than to the lane that lost the report. `error`
          # puts the red on the job that actually has the Maven log explaining why.
          if-no-files-found: error
          retention-days: 1

  slow-unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    # This lane is the workflow's critical path, and it had no cap at all, so it inherited GitHub's 6-hour
    # default: a hung fork would have burned six hours of a runner before anyone saw it.
    #
    # 90 min, up from the 60 that matched unit-tests. The honest duration of this lane has been measured at
    # 39m27s, 46m and 57m40s on `main`, and one run was CANCELLED at 1h0m16s while progressing normally -
    # LSMTreeIndexTest had just completed and no test had failed. A cap within a few minutes of that spread
    # goes red on runner speed alone, and it goes red as "the job failed", which reads as a regression from
    # the PR under test until someone pulls the logs (issue #6323). This cap is a hang detector, so it is
    # sized above the slowest honest run rather than around the median.
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      # `-DexcludedGroups=vector` keeps the lanes a partition rather than an overlap. Both vector classes
      # that moved to the vector lane still carry a method-level @Tag("slow") from before the split, and
      # without this that one method would be selected here as well and run twice per push.
      # -Dmaven.test.failure.ignore=true: see the unit-tests lane. Without it a failing test halts the module
      # at `test`, JaCoCo's report goal never runs at `prepare-package`, and this lane uploads no coverage.
      - name: Run Slow Unit Tests with Coverage
        run: ./mvnw package -Pcoverage --batch-mode --errors --fail-never --show-version -Dmaven.test.failure.ignore=true -pl engine -Dgroups=slow -DexcludedGroups=vector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      #
      # The published check is named for THIS lane. It used to be "Unit Tests Report", the same name the
      # unit-tests job publishes, so the two jobs raced to write one check and whichever finished last won:
      # a failure here could be overwritten by the other lane's green summary, and a reader had no way to
      # tell which lane a given report described.
      - name: Slow Unit Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Slow Unit Tests Report
          path: "**/surefire-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      # A red lane has to name the failing test without a re-run. The reporter check run above is
      # best-effort by design - an API outage makes it a no-op - the per-job log endpoint serves only
      # runner setup and cleanup while any job of the run is still in flight, and nothing else this lane
      # uploads carries a per-test verdict. The report XML is exactly the answer to "which test failed",
      # so it is kept whenever the lane goes red (issue #6322).
      - name: Upload slow unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-unit-test-reports
          path: |
            **/surefire-reports/TEST*.xml
          # A step that failed before Maven wrote any report has nothing to keep, and the red already
          # belongs to that step: an empty match here must not add a second, misleading failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-unit-coverage-reports
          path: |
            **/jacoco*.xml
          if-no-files-found: error
          retention-days: 1

  # The three classes tagged `vector`. PQSearchDebugTest is a steady ~410 s on its own (10,000 x 128
  # PQ-quantized vectors, twice). The other two are the reason this lane exists at all: they are BIMODAL,
  # measured on the same commit at 19 s / 10 s in a green run and at 626 s / 607 s in a run that then hit
  # the unit-test job's 60-minute timeout. LSMVectorIndex.REBUILD_SEMAPHORE holds one permit for the whole
  # JVM, so every vector index in a Surefire fork queues behind every other one - including a rebuild left
  # over from an already-finished class - and the settle waits have to be sized for that worst case.
  #
  # So this split is buying predictability more than raw minutes: it moves ~7 minutes of fixed cost plus a
  # ~20-minute tail risk off the lane that gates every push. It does not fix the convoy, which is still
  # there inside this job. Making the permit count configurable, or scoping it per database, would.
  vector-unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      # -Dmaven.test.failure.ignore=true is load-bearing HERE above all: this lane is a single module, so a
      # failing test costs the entire artifact rather than one module's share of it, and the lane is the one
      # known to fail intermittently (LSMVectorIndex.REBUILD_SEMAPHORE holds one JVM-wide permit, so these
      # classes convoy and occasionally blow their await timeouts). See the unit-tests lane for the mechanism.
      - name: Run Vector Unit Tests with Coverage
        run: ./mvnw package -Pcoverage --batch-mode --errors --fail-never --show-version -Dmaven.test.failure.ignore=true -pl engine -Dgroups=vector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: Vector Unit Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: Vector Unit Tests Report
          path: "**/surefire-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      # A red lane has to name the failing test without a re-run. The reporter check run above is
      # best-effort by design - an API outage makes it a no-op - the per-job log endpoint serves only
      # runner setup and cleanup while any job of the run is still in flight, and nothing else this lane
      # uploads carries a per-test verdict. The report XML is exactly the answer to "which test failed",
      # so it is kept whenever the lane goes red (issue #6322).
      - name: Upload vector unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-unit-test-reports
          path: |
            **/surefire-reports/TEST*.xml
          # A step that failed before Maven wrote any report has nothing to keep, and the red already
          # belongs to that step: an empty match here must not add a second, misleading failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload vector unit test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-unit-coverage-reports
          path: |
            **/jacoco*.xml
          if-no-files-found: error
          retention-days: 1

  # The openCypher TCK: ~3900 conformance scenarios that Surefire reports as a single class, so inside the
  # unit-test lane they were a single line in a 15,000-test pass count. On their own they give a conformance
  # figure that can be read and tracked, and TCKReportPlugin's per-feature breakdown lands in this job's log.
  #
  # Selected by `-Dsurefire.includes` rather than by a tag, and the unit-test lane drops `**/*Suite.java` for
  # the same reason: Surefire's groups/excludedGroups become JUnit tag filters that the suite engine pushes
  # down into Cucumber discovery, where they are matched against feature-file tags instead of against the
  # suite class. Measured both ways - `-Dgroups=opencypher` discovers nothing and fails the build,
  # `-DexcludedGroups=opencypher` excludes nothing and runs all 3897. OpenCypherTCKSuite's javadoc has the detail.
  opencypher-tck-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      # No groups filter at all: any tag filter here would reach the scenarios, not the suite. `**/*Suite.java`
      # currently resolves to OpenCypherTCKSuite alone under `engine`; a second engine suite would join this
      # lane, which is a deliberate default so a new suite runs somewhere rather than nowhere.
      # -Dmaven.test.failure.ignore=true: see the unit-tests lane. Single module here too, so one failing
      # scenario out of ~3900 would otherwise cost the whole lane's engine coverage.
      - name: Run openCypher TCK with Coverage
        run: ./mvnw package -Pcoverage --batch-mode --errors --fail-never --show-version -Dmaven.test.failure.ignore=true -pl engine -Dsurefire.includes=**/*Suite.java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: openCypher TCK Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: openCypher TCK Report
          path: "**/surefire-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      # Also the guard against the suite silently selecting nothing: a discovery that finds no scenario
      # surfaces as a NoTestsDiscovered error in the report, and this script fails the job on it.
      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py surefire-reports

      # TCKReportPlugin writes both forms of the compliance report on every run. Putting the markdown one
      # in the step summary is the whole reason this lane is separate: conformance becomes a number on the
      # job page instead of a line buried in a 15,000-test pass count.
      - name: Publish openCypher TCK compliance report
        if: success() || failure()
        run: |
          if [[ -f engine/target/tck-compliance-report.md ]]; then
            cat engine/target/tck-compliance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            # Not cosmetic: no report means the plugin never reached TestRunFinished, so the run died
            # part-way and any scenario counts reported elsewhere describe a partial run.
            echo "::error::TCK compliance report missing - the suite did not finish"
            echo '## openCypher TCK compliance' >> "$GITHUB_STEP_SUMMARY"
            echo 'Report missing: the suite did not reach the end of the run.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload openCypher TCK compliance report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencypher-tck-compliance-report
          path: |
            engine/target/tck-compliance-report.md
            engine/target/tck-compliance-report.txt
          retention-days: 30

      # Cucumber's HTML report embeds every scenario and runs to ~28 MB, so it is kept only when something
      # failed and someone needs the per-scenario detail. On a green run the compliance report above and the
      # surefire XML already say everything, and 28 MB per push is not worth retaining to say it again.
      - name: Upload openCypher TCK HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencypher-tck-html-report
          path: engine/target/tck-report.html
          retention-days: 7

      # A red lane has to name the failing test without a re-run. The reporter check run above is
      # best-effort by design - an API outage makes it a no-op - the per-job log endpoint serves only
      # runner setup and cleanup while any job of the run is still in flight, and nothing else this lane
      # uploads carries a per-test verdict. The report XML is exactly the answer to "which test failed",
      # so it is kept whenever the lane goes red (issue #6322).
      - name: Upload openCypher TCK test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencypher-tck-test-reports
          path: |
            **/surefire-reports/TEST*.xml
          # A step that failed before Maven wrote any report has nothing to keep, and the red already
          # belongs to that step: an empty match here must not add a second, misleading failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload openCypher TCK coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencypher-tck-coverage-reports
          path: |
            **/jacoco*.xml
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-package
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"

      - name: Download ArcadeDB Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arcadedb-maven-artifacts
          path: /tmp

      - name: Install ArcadeDB Maven artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/arcadedb-m2.tgz -C ~/.m2/repository

      - name: Run Integration Tests with Coverage
        run: ./mvnw verify -DskipTests -Pintegration -Pcoverage  --batch-mode --errors --fail-never --show-version -pl !e2e,!load-tests,!e2e-ha,!ha-raft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The server ITs derive their database dir from SERVER_ROOT_PATH, which the static grep cannot
      # resolve. This job is where that pattern actually runs, so the backstop matters most here.
      - name: Check no test leaked a databases/ directory
        run: ./.github/scripts/check-test-database-paths.sh --runtime

      # See the unit-tests job: the reporter is allowed to fail, the check below is the verdict.
      - name: IT Tests Reporter
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: true
        if: success() || failure()
        with:
          name: IT Tests Report
          path: "**/failsafe-reports/TEST*.xml"
          list-tests: "failed"
          list-suites: "failed"
          reporter: java-junit

      - name: Check test results
        if: success() || failure()
        run: ./.github/scripts/check-test-results.py failsafe-reports

      # A red lane has to name the failing test without a re-run. The reporter check run above is
      # best-effort by design - an API outage makes it a no-op - the per-job log endpoint serves only
      # runner setup and cleanup while any job of the run is still in flight, and nothing else this lane
      # uploads carries a per-test verdict. The report XML is exactly the answer to "which test failed",
      # so it is kept whenever the lane goes red (issue #6322).
      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: |
            **/surefire-reports/TEST*.xml
            **/failsafe-reports/TEST*.xml
          # A step that failed before Maven wrote any report has nothing to keep, and the red already
          # belongs to that step: an empty match here must not add a second, misleading failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload integration test coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage-reports
          path: |
            **/jacoco*.xml
          if-no-files-found: error
          retention-days: 1

