name: release-to-maven-central
on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: "Release version"
        required: true
        default: "2.4.0"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - run: echo "Will start a Maven Central upload with version ${{ github.event.inputs.releaseversion }}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set projects Maven version to GitHub Action GUI set version
        run: ./mvnw versions:set "-DnewVersion=${{ github.event.inputs.releaseversion }}" --no-transfer-progress

      - name: Update studio package.json version
        run: |
          cd studio
          jq --arg version "${{ github.event.inputs.releaseversion }}" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      # server.json is the manifest the MCP registry publishes this server from. It is not a Maven artifact, so
      # versions:set never reaches it and it silently drifted six releases behind HEAD (#6838). Rewrite it here, and
      # only here: it names the last RELEASE, so the next-development step below deliberately leaves it alone rather
      # than pinning a -SNAPSHOT container tag that was never pushed.
      - name: Update server.json MCP registry manifest version
        run: |
          jq --arg version "${{ github.event.inputs.releaseversion }}" \
            '.version = $version | .packages |= map(.identifier |= sub(":[^:]+$"; ":" + $version))' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      # -Dmaven.repository.credentialScope=id (#10023): Maven 3.10 lets a repository transfer use the
      # credentials of server 'central' only against Maven Central's own origin, which is what broke the
      # snapshot deploy in mvn-deploy.yml. A release bundle goes through the Central Portal API instead,
      # which reads the server entry directly, but any transfer to a Sonatype URL under that id would
      # fail with the same 401 - and this workflow only runs on a release, where that costs the release.
      # ./mvnw, not the runner's mvn: the runner image moved to Maven 3.10.0 underneath this workflow,
      # and central-publishing-maven-plugin 0.11.0 then put maven-metadata-local.xml and
      # _remote.repositories into the bundle, so the Central Portal rejected the whole 26.10.2
      # deployment (fixed in plugin 0.12.0). The wrapper pins the Maven that actually publishes, so a
      # Maven upgrade arrives as a reviewable wrapper bump, not silently with a runner image.
      - name: Publish package
        run: |
          export MAVEN_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"
          ./mvnw -Pdeploy,deploy-central -Pdocker  --batch-mode  --errors --fail-at-end --show-version  --file pom.xml -DskipTests=true -pl !e2e -Dmaven.repository.credentialScope=id deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Tag and commit release version
        if: success()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -am "Set release version to ${{ github.event.inputs.releaseversion }}"
          git tag ${{ github.event.inputs.releaseversion }}
          git push origin ${{ github.event.inputs.releaseversion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set next development version
        if: success()
        run: ./mvnw versions:set "-DnewVersion=${{ github.event.inputs.nextversion }}" --no-transfer-progress

      - name: Update studio package.json to next development version
        if: success()
        run: |
          cd studio
          jq --arg version "${{ github.event.inputs.nextversion }}" '.version = $version' package.json > package.json.tmp
          jq --arg version "${{ github.event.inputs.nextversion }}" '.version = $version' package-lock.json > package-lock.json.tmp
          mv package.json.tmp package.json
          mv package-lock.json.tmp package-lock.json

      - name: Commit next development version
        if: success()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -am "Set next development version to ${{ github.event.inputs.nextversion }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
