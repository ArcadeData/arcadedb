name: Native Image

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build the macOS arm64 leg (uses a PAID Larger Runner). Off by default; tick it only to validate that leg before a release."
        type: boolean
        default: false
      # Separates WHICH WORKFLOW runs from WHICH TREE it builds. The workflow definition always
      # comes from the ref the dispatch was fired on; this input is handed to `actions/checkout`
      # instead, so a fixed workflow living on a feature branch can rebuild an already-published
      # tag whose own tree still carries the bug that broke its release.
      #
      # That is not hypothetical: it is the only way to recover from a broken publish step. The
      # `release` event checks out the TAG, so re-firing it re-runs the same broken workflow, and
      # the alternative - branching off the tag and cherry-picking the fix onto it - leaves a
      # throwaway branch behind and puts workflow edits on two branches at once. Leave this empty
      # and checkout behaves exactly as before, which is what `release` and `schedule` runs do
      # (`inputs` is empty on both).
      #
      # Artifacts are named from the CHECKED-OUT tree's pom version, so `ref: 26.9.1` yields
      # arcadedb-26.9.1-<os>-<arch> even when dispatched from a branch whose pom says
      # 26.10.1-SNAPSHOT. Never build from main and rename: main carries commits the release
      # does not.
      ref:
        description: "Git ref to BUILD - tag, branch or SHA (e.g. 26.9.1). Empty = the ref this run was dispatched on."
        type: string
        default: ""
      # A dispatch otherwise publishes NOTHING - every outward-facing step here is gated on
      # `github.event_name == 'release'`. That gate is why "Attach to release" shipped broken from
      # #5323 and was only discovered when it lost every native asset of the 26.9.1 release: no
      # dispatch, and no nightly run, could ever execute it. Ticking this runs that step for real,
      # which both recovers a broken release's assets and makes the step testable before it ships.
      # It republishes the release's Docker images too - the per-arch tags and the multi-arch
      # `-native` manifest - exactly as the `release` event does, so a recovery run leaves the same
      # set behind a real release would. Requires `ref` to name the release's tag; uploads are
      # --clobber and image tags are overwritten, so a mistaken run replaces rather than adds junk.
      attach_to_release:
        description: "Upload the built archives to the GitHub release named by `ref` and push its native Docker images. Off by default. PUBLISHES PUBLICLY."
        type: boolean
        default: false
      # Runs the nightly's publishing path from a dispatch. `schedule` fires only from the default
      # branch, so without this the `latest-native` push could be exercised for the first time only
      # by the first nightly after a merge - the same "untestable until it ships" trap that
      # `attach_to_release` exists to close. Whatever tree the run builds becomes `latest-native`
      # (and `<x.y.z-SNAPSHOT>-native`), so a dispatch from a feature branch publishes that branch;
      # the next nightly overwrites it with main. `attach_to_release` wins if both are ticked.
      publish_nightly:
        description: "Push the Docker images as the nightly does (latest-native + <snapshot>-native). Off by default. PUBLISHES PUBLICLY."
        type: boolean
        default: false
  release:
    types: [published]
  # Daily, because nothing else exercises this workflow. It has no `push`/`pull_request` trigger -
  # a native image build is far too slow to gate a PR on - so before this schedule existed the only
  # runs were a manual dispatch and a published release. That is how the GraalVM pin skew of run
  # 33608446679 sat broken on main for over a month: the Dependabot merge that caused it carried
  # [skip ci], the workflow that would have caught it does not run on push, and the breakage
  # surfaced only when somebody dispatched it by hand. A nightly run turns "discovered at release
  # time" into "discovered the next morning".
  #
  # A scheduled run builds like an ordinary dispatch - three free-runner legs (linux/amd64,
  # linux/arm64, windows/amd64), no paid macOS leg, no release asset upload - with one outward-facing
  # difference: once both Linux containers pass their smoke test it publishes main's nightly native
  # image, the counterpart of the JVM image mvn-deploy.yml pushes as `latest` on every push to main.
  # Tags: `latest-native` and `<x.y.z-SNAPSHOT>-native` (the multi-arch manifests), each over a
  # `-amd64`/`-arm64` per-arch tag. Nightly rather than per push because a native build is far too
  # slow to run on every merge. See the `docker` job for the push gating.
  #
  # 01:41 UTC is an otherwise empty slot: 00:00 already carries load-tests, ha-resilience-tests and
  # the Sunday benchmark, 03:00 bolt-nightly, 04:17 meterian. Off the hour on purpose - GitHub
  # queues on-the-hour crons hardest, and a scheduled run is dropped rather than delayed when the
  # queue is long.
  schedule:
    - cron: "41 1 * * *"

# Least privilege by default: only the build job's "Attach to release" step needs write, and it
# scopes it below. The docker/manifest jobs authenticate to Docker Hub via secrets, not the
# GITHUB_TOKEN, so they keep the read default.
permissions:
  contents: read

jobs:
  # The build matrix is computed here instead of written inline so the macOS arm64 leg can be added
  # CONDITIONALLY. macOS arm64 runs on `macos-15-xlarge`, a PAID "Larger Runners" Apple-Silicon label
  # (the free macos-15, ~7 GB RAM, OOM-thrashes this GraalJS-embedded native image for 40+ minutes -
  # native-image wants ~80% of system RAM against a ~630 MB build heap, which does not fit; the xlarge
  # runner has the headroom it needs). To avoid burning paid minutes on routine runs, that leg is only
  # added to the matrix on a published `release`, or on a manual dispatch that explicitly ticks
  # `include_macos`. On an ordinary dispatch - and on the nightly schedule, where `inputs` is empty
  # so the `= "true"` test is false - it is absent from the matrix entirely, so no paid runner is
  # ever allocated (gating the STEPS instead would still allocate and bill the runner). The three
  # always-on legs - linux/amd64, linux/arm64 (both required) and windows/amd64 (best-effort) - build
  # on free runners. There is no free hosted x64 macOS runner (GitHub retired macos-13) and no free
  # Windows-on-ARM runner, and native-image cannot cross-compile, so each target builds on its own
  # runner of that OS+arch. `linkmode` selects the build/link mode consumed by the "Set up musl
  # toolchain" and "Build native image" steps and native/pom.xml's profiles:
  #   musl-static    - linux/amd64: fully static, musl libc (-Dnative.static=true). Runs on `scratch`
  #                    - see native/src/main/docker/Dockerfile.native.scratch.
  #   mostly-static  - linux/arm64: static except glibc itself (-Dnative.mostlystatic=true). GraalVM CE
  #                    ships no static musl JDK libs for aarch64 (oracle/graal#4645), so the amd64
  #                    leg's fully-static musl mode cannot link here. Needs a glibc runtime - see
  #                    native/src/main/docker/Dockerfile.native.distroless.
  #   dynamic        - windows/amd64 and macos/arm64: ordinary dynamically-linked build (neither ships
  #                    on a Docker image; macOS is release artifact only, see "Attach to release").
  setup:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Assemble matrix (add paid macOS leg only on release / opt-in dispatch)
        id: set
        shell: bash
        run: |
          set -euo pipefail
          include='[
            {"runner":"ubuntu-latest","os_name":"linux","arch":"amd64","required":true,"linkmode":"musl-static"},
            {"runner":"ubuntu-24.04-arm","os_name":"linux","arch":"arm64","required":true,"linkmode":"mostly-static"},
            {"runner":"windows-latest","os_name":"windows","arch":"amd64","required":false,"linkmode":"dynamic"}
          ]'
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.include_macos }}" = "true" ]; then
            include="$(jq -c '. + [{"runner":"macos-15-xlarge","os_name":"macos","arch":"arm64","required":false,"linkmode":"dynamic"}]' <<<"$include")"
            echo "macOS arm64 leg INCLUDED (event=${{ github.event_name }}, include_macos=${{ inputs.include_macos }})"
          else
            include="$(jq -c '.' <<<"$include")"
            echo "macOS arm64 leg EXCLUDED (scheduled run or ordinary dispatch; tick include_macos or publish a release to build it)"
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.required == false }}
    # Scoped write: the "Attach to release" step uploads assets via `gh release upload`.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      # `ref` is empty on `release` and `schedule`, which is checkout's "use the ref that triggered
      # this run" - so those two behave exactly as they did before the input existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # `java-version`, which fetches the `jdk-<version>` release and so reaches GraalVM's MAINLINE
      # builds only. That is deliberate and is the point of the pin: mainline is the line the OS
      # packagers carry (`brew install --cask graalvm-community-jdk25` is 25.0.2), so a contributor
      # can install the matching builder and run a local native build instead of hand-downloading a
      # tarball. The alternative input, `version`, looks up `graal-<version>` first and falls back
      # to `jdk-<version>`, so it reaches the intermediate line too - this step used it while the
      # pin tracked 25.2.4. `version: "25.0.2"` would work here as well; `java-version` is used
      # because it states the intent that this pin stays mainline.
      #
      # Both paths go through findLatestGraalVMCEVersion, which skips any tag node-semver's
      # semver.valid() rejects - which is why the four-component 25.3.4.1 is reachable through
      # NEITHER input, and must never be pinned in native/pom.xml.
      #
      # Careful with the mainline patch numbers: 25.0.3 and 25.0.4 exist on Maven Central but were
      # never published as CE tarballs, so neither is installable here even though bumping
      # native/pom.xml to one of them resolves cleanly. See that property's comment for the table.
      #
      # This is pinned to the EXACT release that native/pom.xml's native.graalvm.version pins the
      # Truffle/polyglot artifacts to. A builder/Truffle version skew fails the native build at
      # feature registration (NoSuchMethodError: OptimizedTruffleRuntime.getLoopNodeFactory()) -
      # see docs/native-image.md "Prerequisites". Move the two together or not at all;
      # .github/scripts/check-native-graalvm-pin.py fails the `lint` job if they disagree.
      - name: Set up GraalVM (Community 25.0.2)
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.1
        with:
          java-version: "25.0.2"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.arch }}-native-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-native-maven-

      # Only the linux/amd64 leg (linkmode: musl-static) builds a fully static (--static
      # --libc=musl, native/pom.xml's native-static profile) executable, and only that mode needs
      # a musl toolchain. That needs more than the compiler:
      #  1. musl-tools + musl-dev (apt) - musl-dev is what actually matters here: on Ubuntu it
      #     installs the arch-prefixed compiler wrapper native-image's musl toolchain probe looks
      #     for (x86_64-linux-musl-gcc - see oracle/graal#7103), plus musl's own static
      #     libc.a/headers under /usr/{include,lib}/x86_64-linux-musl/. musl-tools additionally
      #     provides the unprefixed `musl-gcc`/`musl-ldd` convenience wrapper.
      #  2. A musl-linked static zlib (native-image links libz for the JDK's zip/net code under
      #     --libc=musl), per GraalVM's "Static and Mostly-Static Images" guide
      #     (https://www.graalvm.org/latest/reference-manual/native-image/guides/build-static-executables/).
      #     musl-gcc's generated specs file (/usr/lib/x86_64-linux-musl/musl-gcc.specs) passes
      #     -nostdinc/-nostdlib and restricts header/library search to that same
      #     x86_64-linux-musl directory - it does NOT fall back to the generic /usr/include or
      #     /usr/lib search path. zlib must therefore be installed with --includedir/--libdir
      #     pointed AT that directory (confirmed via musl's own tools/musl-gcc.specs.sh:
      #     "-nostdinc -isystem $incdir" / "-nostdlib" + "-L$libdir"), not a plain --prefix=/usr,
      #     or native-image's `-lz` link step will not find it without extra
      #     -H:CLibraryPath/-H:CIncludePath buildArgs (native/pom.xml intentionally adds only
      #     --static --libc=musl, nothing path-related).
      #
      # linux/arm64 (linkmode: mostly-static) deliberately does NOT run this step: GraalVM CE
      # ships no static musl JDK libraries for aarch64 (the graalvm-community-jdk-25.0.2
      # linux-aarch64 release tarball has lib/static/linux-aarch64/glibc but not
      # lib/static/linux-aarch64/musl - linux-amd64 ships both - see oracle/graal#4645, closed
      # not-planned; both halves re-listed out of the 25.0.2 tarballs when the pin moved back to
      # this release), so --static --libc=musl can never link on that architecture regardless of
      # toolchain setup. Rather than run a toolchain step known to be useless there, the arm64 leg
      # instead builds with -Dnative.mostlystatic=true (native/pom.xml's native-mostly-static
      # profile: -H:+StaticExecutableWithDynamicLibC - static except glibc itself), which needs no
      # musl/zlib toolchain at all. See docs/native-image.md and
      # native/src/main/docker/Dockerfile.native.distroless for the Docker-side implications of
      # that different build mode.
      - name: Set up musl toolchain (static Linux builds)
        if: ${{ matrix.linkmode == 'musl-static' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

          TRIPLET="$(uname -m)-linux-musl"
          MUSL_GCC="${TRIPLET}-gcc"
          MUSL_INCDIR="/usr/include/${TRIPLET}"
          MUSL_LIBDIR="/usr/lib/${TRIPLET}"
          command -v "$MUSL_GCC" >/dev/null || { echo "::error::$MUSL_GCC not found after installing musl-dev"; exit 1; }

          ZLIB_VERSION="1.3.2"
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" -o /tmp/zlib.tar.gz
          tar xzf /tmp/zlib.tar.gz -C /tmp
          (
            cd "/tmp/zlib-${ZLIB_VERSION}"
            CC="$MUSL_GCC" ./configure --static --prefix=/usr --includedir="$MUSL_INCDIR" --libdir="$MUSL_LIBDIR"
            make -j"$(nproc)"
            sudo make install
          )

          echo "CC=$MUSL_GCC" >> "$GITHUB_ENV"
          "$MUSL_GCC" --version
          "$MUSL_GCC" -print-file-name=libz.a

      - name: Build native image
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          case "${{ matrix.linkmode }}" in
            musl-static)   ARGS="-Dnative.static=true" ;;
            mostly-static) ARGS="-Dnative.mostlystatic=true" ;;
            dynamic)       ARGS="" ;;
            *)              echo "::error::unknown matrix.linkmode '${{ matrix.linkmode }}'"; exit 1 ;;
          esac
          mvn -B -ntp -Pnative -pl native -am -DskipTests $ARGS package

      # native-maven-plugin names the executable via os-maven-plugin's os.detected.name/arch
      # (e.g. osx-aarch_64, linux-x86_64, windows-x86_64), which does NOT match this matrix's
      # os_name/arch labels (macos/arm64, linux/amd64, ...). Glob for the one file under
      # native/target/ that IS the executable instead of constructing the name from matrix
      # fields or excluding known non-binary extensions: the latter is brittle because
      # native-image build-report artifacts (e.g. svm_err_*.md, other future report formats) can
      # match 'arcadedb-*' without matching any of the excluded extensions and trip the `-ne 1`
      # guard below. Select by the executable bit instead (Linux/macOS: `-perm -u+x`; Windows has
      # no meaningful POSIX exec bit, so match the '.exe' suffix native-maven-plugin always adds
      # there instead).
      - name: Locate native binary
        id: locate
        shell: bash
        run: |
          cd native/target
          # Populate the array with a portable while-read loop rather than `mapfile`/`readarray`
          # (bash 4+): GitHub's macOS runners can resolve `shell: bash` to the system bash 3.2, which
          # has neither. This loop is equivalent and works on bash 3.2 (macOS), Git Bash (Windows) and
          # Linux alike.
          CANDIDATES=()
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            while IFS= read -r f; do CANDIDATES+=("$f"); done \
              < <(find . -maxdepth 1 -type f -name 'arcadedb-*.exe' -print | sed 's|^\./||')
          else
            while IFS= read -r f; do CANDIDATES+=("$f"); done \
              < <(find . -maxdepth 1 -type f -name 'arcadedb-*' -perm -u+x -print | sed 's|^\./||')
          fi
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one native binary in native/target, found ${#CANDIDATES[@]}"
            ls -la .
            exit 1
          fi
          echo "bin_name=${CANDIDATES[0]}" >> "$GITHUB_OUTPUT"
          echo "[locate] native binary: ${CANDIDATES[0]}"

      # Wire-protocol client tools for exercise.sh's Postgres/gRPC checks, installed on BOTH Linux
      # legs (amd64 AND arm64: the musl-toolchain step above runs only on amd64, so relying on it
      # would leave arm64 without psql, which is exactly the gap the WIRE_STRICT hard-fail below
      # would otherwise trip on). Both Linux legs pass the full wire-protocol plugin list to the
      # Smoke test step below and now run it with WIRE_STRICT=1, so a missing client tool here
      # would fail the build - these installs make that a non-issue instead of a false negative.
      #   postgresql-client - psql, for the Postgres-wire check (apt package, both arches).
      #   grpcurl            - for the gRPC reflection-list check. No apt package; installed from
      #                        the upstream release tarball, matched to the runner's arch.
      #   python3 (Mongo) and xxd (Bolt) are NOT installed here: both ship preinstalled on the
      #   ubuntu-latest and ubuntu-24.04-arm runner images already (see actions/runner-images'
      #   published Ubuntu 24.04 software manifests), so nothing to add for those two checks.
      - name: Install wire-protocol client tools (Linux)
        if: ${{ matrix.os_name == 'linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          GRPCURL_VERSION="1.9.3"
          case "${{ matrix.arch }}" in
            amd64) GRPCURL_ARCH="x86_64" ;;
            arm64) GRPCURL_ARCH="arm64" ;;
            *)     echo "::error::unknown matrix.arch '${{ matrix.arch }}' for grpcurl install"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_${GRPCURL_ARCH}.tar.gz" \
            -o /tmp/grpcurl.tar.gz
          sudo tar xzf /tmp/grpcurl.tar.gz -C /usr/local/bin grpcurl
          rm -f /tmp/grpcurl.tar.gz
          grpcurl --version
          psql --version

      # Windows smoke is best-effort (job-level continue-on-error already covers it); Git Bash on
      # the windows-latest runner can execute smoke.sh directly. Only the two Linux jobs pass the
      # full wire-protocol plugin list, matching trace.sh, so Postgres/Redis/Mongo/Bolt/gRPC are
      # actually reachable for exercise.sh's checks - and, per the client-tools step above, both
      # Linux legs now have every client tool those checks need. WIRE_STRICT=1 turns those checks
      # from best-effort WARN-skips into hard assertions on those two legs, so a native-image
      # regression that breaks e.g. Bolt or Redis fails the build instead of staying green;
      # macOS/Windows deliberately leave WIRE_STRICT unset (client tools not guaranteed there).
      - name: Smoke test
        shell: bash
        run: |
          BIN="native/target/${{ steps.locate.outputs.bin_name }}"
          chmod +x "$BIN" || true
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            PLUGINS="Postgres:com.arcadedb.postgres.PostgresProtocolPlugin"
            PLUGINS="$PLUGINS,Redis:com.arcadedb.redis.RedisProtocolPlugin"
            PLUGINS="$PLUGINS,MongoDB:com.arcadedb.mongo.MongoDBProtocolPlugin"
            PLUGINS="$PLUGINS,Bolt:com.arcadedb.bolt.BoltProtocolPlugin"
            PLUGINS="$PLUGINS,Grpc:com.arcadedb.server.grpc.GrpcServerPlugin"
            # Prometheus is the only observability plugin that must be named; the OTLP metrics and
            # tracing plugins activate from their enable flag alone (#7281). smoke.sh points both OTLP
            # endpoints at its own stand-in collector (otlp_sink.py, #9425), and exercise.sh asserts a
            # metrics push and a span batch reached it, so the export path runs inside the image.
            PLUGINS="$PLUGINS,Prometheus:com.arcadedb.metrics.prometheus.PrometheusMetricsPlugin"
            WIRE_STRICT=1 native/src/test/scripts/smoke.sh "$BIN" -Dorg.jline.terminal.dumb=true "-Darcadedb.server.plugins=$PLUGINS" \
              -Darcadedb.serverMetrics.otlp.enabled=true \
              -Darcadedb.serverMetrics.tracing.enabled=true -Darcadedb.serverMetrics.tracing.samplingRate=1.0
          else
            native/src/test/scripts/smoke.sh "$BIN" -Dorg.jline.terminal.dumb=true
          fi

      # Three native nodes forming a Raft cluster on loopback, a write through the leader and a read
      # of it from every node (#9407). Proves arcadedb-ha-raft works inside the image: Ratis builds
      # its gRPC transport and state machine reflectively, so a binary that boots as a single node can
      # still fail as soon as two peers talk. The two required Linux legs only, like the strict wire
      # checks above: macOS/Windows are best-effort and have no musl/glibc static story to protect.
      - name: HA smoke test
        if: ${{ matrix.os_name == 'linux' }}
        shell: bash
        run: |
          BIN="native/target/${{ steps.locate.outputs.bin_name }}"
          native/src/test/scripts/ha-smoke.sh "$BIN" -Dorg.jline.terminal.dumb=true

      # Publishes the archive it created as a step output, because "Attach to release" below cannot
      # discover it with a glob: `gh release upload` expands each asset argument itself and treats a
      # pattern matching nothing as a FATAL error, and each leg produces exactly one archive - the
      # three Unix legs a .tar.gz and no .zip, Windows a .zip and no .tar.gz. Passing both patterns
      # unconditionally therefore failed on every leg, which is how release run 33796693420 lost all
      # of 26.9.1's native assets after building, smoke-testing and packaging every one of them.
      # .github/scripts/check-release-upload-assets.py fails the `lint` job if a glob comes back.
      - name: Package artifact
        id: package
        shell: bash
        run: |
          cd native/target
          BIN="${{ steps.locate.outputs.bin_name }}"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            ARCHIVE="${BIN%.exe}.zip"
            7z a "$ARCHIVE" "$BIN"
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" || shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            ARCHIVE="$BIN.tar.gz"
            tar czf "$ARCHIVE" "$BIN"
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" || sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "[package] archive: $ARCHIVE (+ $ARCHIVE.sha256)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcadedb-native-${{ matrix.os_name }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            native/target/arcadedb-*.tar.gz
            native/target/arcadedb-*.zip
            native/target/*.sha256

      # Reachable two ways, and it needs both. A published release attaches automatically, as
      # before. A dispatch attaches only when `attach_to_release` is ticked, which is what makes
      # this step recoverable AND testable: before that opt-in existed it could run only during a
      # real release, so the glob bug above shipped from #5323 and surfaced by losing every native
      # asset of 26.9.1. RELEASE_TAG follows the same split - the release's own tag on a release,
      # the `ref` input on a dispatch, since that is the tree whose version the archives are named
      # for. Uploading elsewhere would attach 26.9.1 binaries to some other release.
      - name: Attach to release
        if: ${{ github.event_name == 'release' || inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # `attach_to_release` with no `ref` has no tag to upload to. Fail here rather than let
          # `gh` be handed an empty tag argument.
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::attach_to_release is set but 'ref' is empty - there is no release to upload to. Dispatch again with ref set to the release's tag (e.g. 26.9.1)."
            exit 1
          fi
          echo "[attach] uploading $ARCHIVE (+ .sha256) to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            "native/target/$ARCHIVE" "native/target/$ARCHIVE.sha256" \
            --clobber

  # Packages the two required Linux binaries (musl-static amd64, mostly-static-glibc arm64) built
  # by the `build` job above into minimal Docker images, one per arch, each built natively on a
  # runner of that architecture (no QEMU cross-emulation). See native/src/main/docker/
  # Dockerfile.native.scratch (amd64, FROM scratch) and Dockerfile.native.distroless (arm64,
  # FROM gcr.io/distroless/base-debian12:nonroot) for why the two arches need different bases.
  #
  # Push gating: this workflow has no `push:` trigger at all (only workflow_dispatch, release and
  # schedule), so a plain branch push can never reach this job. Every run builds with --load into
  # the runner's local Docker daemon and smoke-tests THAT image; only afterwards, and only on a
  # publishing run, are its tags pushed - so a broken image never reaches Docker Hub, which matters
  # most for the nightly `latest-native` that nobody reviews before it ships. Publishing runs:
  #   release                        - `<version>-native-<arch>`
  #   dispatch + attach_to_release   - the same, for the release named by `ref` (recovery)
  #   schedule (always main)         - `latest-native-<arch>` and `<x.y.z-SNAPSHOT>-native-<arch>`
  #   dispatch + publish_nightly     - the same as schedule, for whatever tree the run built
  # An ordinary dispatch (e.g. to validate this job from a feature branch during review) publishes
  # nothing: it exercises the Dockerfiles and build context end-to-end and stops there.
  docker:
    name: docker-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    # The tag prefixes the per-arch images were pushed under ("26.9.1", or "latest 26.10.1-SNAPSHOT"
    # on a nightly). Both legs derive it from the same event and the same pom-named tarball, so
    # whichever leg writes it last, `manifest` stitches exactly what was pushed.
    outputs:
      channels: ${{ steps.build.outputs.channels }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: amd64, dockerfile: native/src/main/docker/Dockerfile.native.scratch }
          - { runner: ubuntu-24.04-arm, arch: arm64, dockerfile: native/src/main/docker/Dockerfile.native.distroless }
    steps:
      # Same ref as the `build` job: this job's build context and Dockerfiles must come from the
      # tree the binary was built from, not from whichever branch the run was dispatched on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arcadedb-native-linux-${{ matrix.arch }}
          path: dl

      # The downloaded artifact holds exactly one tarball (arcadedb-<version>-linux-<os-arch
      # triplet>.tar.gz, e.g. ...-linux-x86_64.tar.gz - os-maven-plugin's os.detected.arch, NOT
      # this workflow's amd64/arm64 matrix label) plus its .sha256, so `ls dl/arcadedb-*.tar.gz`
      # unambiguously finds it without needing to match matrix.arch against a differently-spelled
      # arch string. $VERSION is parsed back out of that same filename (greedy match up to the
      # one "-linux-" separator handles a version string that itself contains dashes, e.g.
      # "26.8.1-SNAPSHOT") instead of re-invoking Maven just to re-derive project.version.
      - name: Stage build context
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ctx/config
          TARBALL="$(ls dl/arcadedb-*.tar.gz)"
          BIN_BASENAME="$(basename "$TARBALL" .tar.gz)"
          VERSION="$(echo "$BIN_BASENAME" | sed -E 's/^arcadedb-(.*)-linux-[^-]+$/\1/')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$BIN_BASENAME" ]; then
            echo "::error::could not parse version out of tarball name '$BIN_BASENAME'"
            exit 1
          fi
          tar xzf "$TARBALL" -C ctx
          mv "ctx/$BIN_BASENAME" ctx/arcadedb
          cp -r package/src/main/config/* ctx/config/
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cp /etc/ssl/certs/ca-certificates.crt ctx/ca-certificates.crt
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.attach_to_release || inputs.publish_nightly }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The push decision reads both values from env and compares each in its OWN test. #7282 wrote
      # it as `[ "<event>" = "release" || <attach> ]`, which is not a test at all: `[` errors out on
      # the missing `]` and the shell runs `<attach> ]` as a command. On a release `inputs` is empty,
      # so that command is a bare `]` (not found) and every release silently built with --load - no
      # per-arch tag reached Docker Hub and `manifest` failed - while a dispatch pushed only because
      # `true ]` happens to exit 0. Lint's actionlint hook now rejects that shape in this file.
      #
      # A nightly pushes its version tag only for a -SNAPSHOT version: main carries a release version
      # just for the moment mvn-release.yml tags it, and a nightly landing in that window must not
      # overwrite the release's own `<version>-native-<arch>`. `latest` is pushed regardless.
      - name: Build per-arch image
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ATTACH_TO_RELEASE: ${{ inputs.attach_to_release }}
          PUBLISH_NIGHTLY: ${{ inputs.publish_nightly }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail
          CHANNELS=""
          if [ "$EVENT_NAME" = "release" ] || [ "$ATTACH_TO_RELEASE" = "true" ]; then
            CHANNELS="$VERSION"
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$PUBLISH_NIGHTLY" = "true" ]; then
            CHANNELS="latest"
            case "$VERSION" in
              *-SNAPSHOT) CHANNELS="$CHANNELS $VERSION" ;;
              *)          echo "::warning::nightly built non-SNAPSHOT version $VERSION - publishing latest-native only" ;;
            esac
          fi
          TAG="arcadedata/arcadedb:${VERSION}-native-${{ matrix.arch }}"
          TAG_ARGS=(-t "$TAG")
          for c in $CHANNELS; do
            [ "$c" = "$VERSION" ] || TAG_ARGS+=(-t "arcadedata/arcadedb:${c}-native-${{ matrix.arch }}")
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "[docker] event=$EVENT_NAME attach_to_release=$ATTACH_TO_RELEASE publish_nightly=$PUBLISH_NIGHTLY channels='${CHANNELS:-none (local only)}'"
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            -f "${{ matrix.dockerfile }}" \
            "${TAG_ARGS[@]}" \
            --load ctx

      # The container is validated with the same Java e2e battery mvn-test.yml runs against the JVM image (e2e module,
      # Testcontainers): the image is its only parameter, so every protocol, query language and SQL feature the JVM image
      # is held to - plus the native-specific regressions (reflective SQL paths, every Lucene analyzer, math_*, #9495) -
      # is asserted against the packaged native image. The suite ends with ServerLogIT, which fails on a
      # ClassNotFoundException / MissingReflectionRegistrationError / log-handler failure anywhere in the server log.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: E2E tests against the native image
        shell: bash
        env:
          ARCADEDB_DOCKER_IMAGE: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # the e2e module's client dependencies (network, grpc-client) come from this tree, not from a published snapshot
          ./mvnw -B -q install -DskipTests -pl e2e -am
          ./mvnw -B verify -Pintegration -pl e2e -Darcadedb.test.native=true

      - name: Upload native E2E test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-e2e-test-reports-${{ matrix.arch }}
          path: e2e/target/failsafe-reports/
          if-no-files-found: ignore

      # Runs only after the e2e battery above passed against this exact local image. Pushes the per-arch
      # tag of every channel the build step chose; an empty list (ordinary dispatch) skips the step.
      - name: Push per-arch image
        if: ${{ steps.build.outputs.channels != '' }}
        shell: bash
        env:
          CHANNELS: ${{ steps.build.outputs.channels }}
        run: |
          set -euo pipefail
          for c in $CHANNELS; do
            echo "[docker] pushing arcadedata/arcadedb:${c}-native-${{ matrix.arch }}"
            docker push "arcadedata/arcadedb:${c}-native-${{ matrix.arch }}"
          done

  # Stitches the per-arch tags pushed by the `docker` job above into one multi-arch manifest per
  # channel: `<version>-native` on a release or a recovery dispatch, `latest-native` and
  # `<x.y.z-SNAPSHOT>-native` on the nightly (or a `publish_nightly` dispatch). Guarded by the same
  # cases as the `docker` job's push; every other run leaves nothing in the registry to stitch.
  manifest:
    needs: docker
    if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.attach_to_release || inputs.publish_nightly }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The channels come from the `docker` job, which parsed the version out of the artifact
      # tarball name, not from github.event.release.tag_name. On a release the two agree (tags are
      # plain Maven versions with no "v" prefix - see mvn-release.yml), but neither a dispatch nor
      # the nightly has a release event, and a dispatch's `ref` may name a SHA or branch.
      - name: Create multi-arch manifests
        env:
          CHANNELS: ${{ needs.docker.outputs.channels }}
        run: |
          set -euo pipefail
          if [ -z "$CHANNELS" ]; then
            echo "::error::the docker job pushed no channel - nothing to stitch"
            exit 1
          fi
          for c in $CHANNELS; do
            echo "[manifest] arcadedata/arcadedb:${c}-native"
            docker buildx imagetools create -t "arcadedata/arcadedb:${c}-native" \
              "arcadedata/arcadedb:${c}-native-amd64" \
              "arcadedata/arcadedb:${c}-native-arm64"
          done
