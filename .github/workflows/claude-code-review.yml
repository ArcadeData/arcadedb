name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Cancel this PR's superseded run on a new push; other events are keyed by SHA and never cancel
# each other. Rationale in mvn-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Read-only on purpose: the model reads untrusted PR content, so it gets no write tool. It returns
    # a verdict instead, and the flag-security-hazard job below applies the label (#10600).
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      security_hazard: ${{ fromJSON(steps.claude-review.outputs.structured_output || '{}').security_hazard == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            - If the PR is likely coming from an external contributor, pay extra attention to security, in the case a user is maliciously introducing security hazards in the code base

            Report your security verdict in the structured output: set `security_hazard` to true only when
            the PR introduces a security hazard into the code base, and say why in `security_reason`. Do not
            try to label the PR yourself: a later step does that from your verdict.

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --model claude-sonnet-5-5
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --json-schema '{"type":"object","properties":{"security_hazard":{"type":"boolean"},"security_reason":{"type":"string"}},"required":["security_hazard"]}'

  # Applies the label the review asked for. The label name is fixed here, never taken from the model,
  # and this job runs no model and checks nothing out, so the write scope is never in reach of PR content.
  #
  # Fork PRs: a `pull_request` run from a fork gets a read-only GITHUB_TOKEN and no OIDC token, so the
  # review job above already fails there and this job never runs. The automatic flag therefore covers
  # same-repository PRs only; an external contributor's PR is reviewed through an `@claude review`
  # comment (claude.yml), and its security verdict is the maintainer's to act on.
  flag-security-hazard:
    needs: claude-review
    if: needs.claude-review.outputs.security_hazard == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label the PR "do not merge"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The labels endpoint, not `gh pr edit`: the latter also reads project data the token cannot see.
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f 'labels[]=do not merge'
