name: Bolt Conformance Spec Validation

on:
  push:
    paths:
      - 'bolt/conformance/**'
      - '.github/workflows/bolt-conformance-spec.yml'
  pull_request:
    paths:
      - 'bolt/conformance/**'
      - '.github/workflows/bolt-conformance-spec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate spec.yaml structural integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: bolt/conformance
        run: pip install -r requirements.txt

      - name: Run validator unit tests
        working-directory: bolt/conformance
        run: python3 -m unittest test_validate_spec.py -v

      - name: Run conformance tools unit tests
        working-directory: bolt/conformance/tools
        run: |
          python3 -m unittest test_junit_to_matrix.py -v
          python3 -m unittest test_merge_matrix.py -v
          python3 -m unittest test_render_matrix.py -v

      - name: Validate spec.yaml
        working-directory: bolt/conformance
        run: python3 validate_spec.py spec.yaml
