# Meterian dependency scan.
#
# #5636 item 4 recorded this check as "fails on every commit because the Python bindings kill the run". That
# diagnosis was wrong and is corrected here so nobody chases it again: the scan COMPLETES ("Execution successful!",
# 633 dependencies uploaded). It fails on `Failed checks: [security]`, i.e. Meterian's own composite security score
# of 0 against a minimum of 90, driven by real advisories in the transitive graph - CVE-2026-33186 (critical) in
# google.golang.org/grpc pulled in by e2e-go, plus ~40 npm and Java findings.
#
# The scan ran with continue-on-error while that score could not pass: a permanent red X teaches reviewers to ignore
# red. PR #11237 cleaned the graph (security 0 -> 98 on 2026-11-03), so the scan blocks again, on security and
# licensing only (see the scanner step). A pull request that brings in a vulnerable dependency now fails here, and
# the daily run on main fails when a new advisory hits a dependency already in use. The findings are also uploaded
# as GitHub code-scanning alerts (SARIF, below), which is where they are triaged.
#
# What the upload does NOT carry is Meterian's stability dimension. Those findings report only that a newer release
# of a dependency exists - Dependabot's job, and it is configured for every ecosystem in this repo - so they are
# filtered out of the report before it is uploaded (see the "Drop stability findings" step). They were 46 of the 65
# alerts on 2026-08-13, and a security tab that is 71% version drift does not get triaged.

name: Meterian Scanner workflow

on:
  push:
    branches: [main]
  # A pull request is scanned merged into main, so it fails only on a vulnerable dependency it brings in itself.
  pull_request:
  schedule:
    # Daily, so the alert set stays current between main commits.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel this PR's superseded run on a new push; other events are keyed by SHA and never cancel
# each other. Rationale in mvn-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meterian_scan:
    name: Meterian client scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Meterian Scanner
        # Blocking. The client's exit code adds 1 for a failed security score, 2 for stability and 4 for licensing.
        # --min-stability=0 keeps stability out of it: that score only says newer releases exist (Dependabot's job)
        # and drops as upstream ships, with nothing in the pull request causing it. --fail-gracefully turns
        # Meterian's own failures ("We were not able to successfully analyse this project", seen on a PR scan on
        # 2026-11-03) into exit 0, so an outage there is not a red X here. Security keeps the default minimum of 90
        # and licensing 95.
        uses: MeterianHQ/meterian-github-action@9603528ad7eb3e76e7181d8d721bba25665a403d # v1.0.18
        with:
          # The e2e-go, e2e-js and e2e-python harnesses are excluded: they drive a server under test from CI and ship in
          # no ArcadeDB distribution, yet they declare their client drivers as runtime dependencies, which Meterian then
          # scores as production code (e2e-js alone put ieee754 and xtend, via neo4j-driver and pg, in the report). Their
          # dependencies stay under Dependabot, and e2e-js under the blocking runtime audit of e2e-dependency-audit.yml.
          cli_args: >-
            --exclude-folders=**/e2e-go,**/e2e-js,**/e2e-python
            --min-stability=0
            --fail-gracefully
            --report-console=nocolor
            --report-sarif=report.sarif
          oss: true
      - name: Drop stability findings from the report
        # Meterian puts security, stability and licensing findings in one SARIF, and the stability
        # ones ("<pkg> is outdated") are not vulnerabilities - they say a newer release exists,
        # which is what Dependabot already opens PRs for. On the 2026-08-13 scan of main they were
        # 46 of 65 alerts, so 71% of the security tab was version-drift noise that the actual
        # security findings had to be read around.
        #
        # This is done here, not in the scanner, because Meterian has no flag for it:
        # --report-console takes a security|stability|licensing filter but --report-sarif takes a
        # filename only, and the .meterian exclusions file is documented as acting on the scores, not
        # on the report contents. See the script header.
        continue-on-error: true
        if: success() || failure()
        run: .github/scripts/filter-meterian-sarif.py report.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # continue-on-error: a pull request from a FORK gets a read-only token no matter what
        # `security-events: write` says, so this upload cannot succeed there - and it, not the scan, would then turn
        # the job red on exactly the PRs external contributors and Dependabot open. Uploading
        # is best-effort; on same-repo runs (every push to main, the nightly, and internal PRs) it still populates
        # code scanning, which is where these findings are triaged.
        continue-on-error: true
        if: success() || failure()
        with:
          sarif_file: report.sarif
