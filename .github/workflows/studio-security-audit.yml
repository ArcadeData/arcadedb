  # ArcadeDB Studio Security Audit Workflow
# Runs automated security checks on the frontend dependencies

name: "Studio Security Audit"

on:
  # Run on all pushes to main and PRs
  push:
    branches: [ main ]
    paths:
      - "studio/**"
      - ".github/workflows/studio-security-audit.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "studio/**"
      - ".github/workflows/studio-security-audit.yml"

  # Run weekly security audit
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC

  # Allow manual triggering
  workflow_dispatch:

jobs:
  security-audit:
    name: "Frontend Security Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./studio

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must match the node.version pinned in studio/pom.xml: the "Test Build Process" step below runs
          # the same webpack build Maven runs, and copy-webpack-plugin 14 calls Array.prototype.toSorted,
          # which does not exist before Node 20. On Node 18 the build died with "toSorted is not a function".
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "studio/package-lock.json"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run npm Security Audit"
        run: |
          echo "🔍 Running npm security audit..."
          npm audit --audit-level=moderate

      - name: "Check for Outdated Packages"
        run: |
          echo "📊 Checking for outdated packages..."
          npm outdated || true

      - name: "Run Comprehensive Security Audit Script"
        run: |
          echo "🔐 Running comprehensive security audit..."
          chmod +x ./scripts/security-audit.sh
          ./scripts/security-audit.sh

      - name: "Validate Package.json"
        run: |
          echo "📋 Validating package.json..."
          # Compare the MAJOR version of each declared range instead of grepping the raw line. The
          # previous greps matched any digit anywhere after the package name, so `"bootstrap": "^5.3.8"`
          # tripped `bootstrap.*[1-4]\.` through its "3." and `"sweetalert2": "^11.26.25"` tripped
          # `sweetalert2.*1[0-1]\.[0-5]` through its "11.2": the step failed on perfectly current,
          # non-vulnerable dependencies and would have kept doing so on every future patch bump.
          node -e '
            const pkg = require("./package.json");
            const declared = { ...pkg.dependencies, ...pkg.devDependencies };
            // package -> lowest major considered safe, with the reason it is the floor
            const floors = {
              jquery: [3, "jQuery 1.x/2.x carry unpatched XSS advisories"],
              bootstrap: [5, "Bootstrap 4.x and earlier are EOL with known XSS issues"],
              sweetalert2: [11, "SweetAlert2 below 11 is unmaintained"],
              // This is where a per-package minimum version can actually be enforced: the dependency-review action has
              // no min-version option, so the rules the (inert) config file used to list live here (issue #5639).
              "datatables.net": [2, "DataTables 1.x has known XSS issues and is superseded"]
            };
            let failed = false;
            for (const [name, [floor, reason]] of Object.entries(floors)) {
              const range = declared[name];
              if (range === undefined)
                continue;
              const major = Number.parseInt(String(range).replace(/^[^0-9]*/, ""), 10);
              if (Number.isNaN(major)) {
                console.log(`⚠️  ${name}: cannot read a major version out of "${range}", not checked`);
                continue;
              }
              if (major < floor) {
                console.log(`❌ ${name} ${range} is below the required major ${floor}: ${reason}`);
                failed = true;
              }
            }
            if (failed)
              process.exit(1);
            console.log("✅ Package versions look secure");
          '

      - name: "Test Build Process"
        run: |
          echo "🏗️ Testing build process..."
          npm run build

      - name: "Analyze Bundle Size"
        run: |
          echo "📦 Analyzing bundle sizes..."
          if [ -d "src/main/resources/static/dist" ]; then
            echo "Built assets:"
            du -h src/main/resources/static/dist/**/* | sort -hr | head -10

            # Check for unexpectedly large bundles
            find src/main/resources/static/dist -name "*.js" -size +1M | while read file; do
              echo "⚠️ Large bundle detected: $file ($(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes)"
            done
          else
            echo "❌ Build output not found!"
            exit 1
          fi

      - name: "License Compliance Check"
        run: |
          echo "🏷️ Checking license compliance..."
          # Use npx for license-checker
          if npx license-checker --version &> /dev/null; then
            echo "Running license compliance check with npx..."
            npx license-checker --summary --excludePrivatePackages

            # Check for problematic licenses
            npx license-checker --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD" || echo "⚠️ Non-standard licenses detected - review required"
          else
            echo "ℹ️ license-checker not available, skipping detailed license analysis"
          fi

      - name: "Security Summary"
        if: always()
        run: |
          echo ""
          echo "🔒 Security Audit Summary"
          echo "========================"
          echo "✅ npm audit: $(npm audit --audit-level=high --json | jq -r '.metadata.vulnerabilities.high // 0') high-severity vulnerabilities"
          echo "✅ Package validation: Completed"
          echo "✅ Build process: Verified"
          echo "✅ Bundle analysis: Completed"
          echo ""
          echo "For detailed security information, see the security audit script output above."

  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The whole policy (severity, scopes, denied licences, denied packages) lives in the config file, which is
          # written in the flat schema the action actually reads. Nothing else is passed here on purpose: an inline
          # input OVERRIDES the file (readConfig merges `{...externalConfig, ...inlineConfig}`), so a duplicated
          # fail-on-severity or deny-licenses would silently shadow the file and split the policy in two (issue #5639).
          # In particular, no allow-dependencies-licenses: that input takes package URLs of dependencies to exempt from
          # the license check ("pkg:npm/foo@1.2.3"), not a list of acceptable licenses, so the SPDX ids that used to sit
          # here failed the action's own input validation and the job errored out before reviewing anything.
          config-file: ".github/dependency-review-config.yml"

  codeql-analysis:
    name: "CodeQL Security Analysis"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3.29.5
        with:
          languages: javascript
          queries: security-and-quality

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3.29.5
